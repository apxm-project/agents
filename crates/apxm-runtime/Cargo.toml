[package]
name = "apxm-runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
# Internal dependencies
apxm-core = { path = "../apxm-core" }
apxm-backends = { path = "../apxm-backends" }
apxm-artifact = { path = "../apxm-artifact" }
apxm-sandbox = { path = "../apxm-sandbox" }

# Async runtime
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "sync", "time", "rt", "process", "io-util", "fs"] }
async-trait = "0.1"
futures = "0.3"
tokio-stream = "0.1"

# Concurrency
crossbeam-deque = "0.8"
dashmap = { version = "6.0", optional = true }
parking_lot = "0.12"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonschema = "0.18"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

# HTTP client (for COMMUNICATE HTTP/A2A dispatch)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Utilities
once_cell = "1.0"
uuid = { version = "1.0", features = ["v7", "v4"] }
chrono = "0.4"
num_cpus = "1.0"
priority-queue = "1.0"

# Sandbox
tempfile = "3"

# Terminal output
termimad = "0.30"
# ModelRouter dependencies
dirs = "5.0"
toml = "0.9"

# Persistent cache (use rusqlite 0.32 to match sqlx's libsqlite3-sys 0.28)
rusqlite = { version = "0.32", features = ["bundled"], optional = true }

[features]
default = ["dashmap", "sqlite"]
dashmap = ["dep:dashmap"]
sqlite = ["dep:rusqlite"]
metrics = ["apxm-backends/metrics"]
# Compile out all tracing for zero overhead (propagates to apxm-core)
no-trace = ["apxm-core/no-trace"]
