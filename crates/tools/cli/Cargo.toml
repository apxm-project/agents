[package]
name = "apxm-cli"
version.workspace = true
edition.workspace = true
build = "build.rs"
publish = false
description = "APxM CLI - canonical local and remote APXM command surface"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "apxm"
path = "src/main.rs"

[dependencies]
apxm-core.workspace = true
apxm-ais.workspace = true
apxm-backends.workspace = true
apxm-program.workspace = true
apxm-execution.workspace = true
apxm-inference.workspace = true
apxm-kernel.workspace = true
apxm-backend-registry.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "io-util"] }
async-trait.workspace = true
anyhow.workspace = true
colored.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing-subscriber = { workspace = true, optional = true }
chrono.workspace = true
reqwest = { version = "0.13", features = ["blocking", "stream", "json", "rustls"], default-features = false }
walkdir.workspace = true
tempfile.workspace = true
toml.workspace = true
# agent new/sync/lint/build/install manifest parsing + integrity hash chain.
sha2.workspace = true
rusqlite = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "io-util"] }
tempfile.workspace = true
toml.workspace = true

[build-dependencies]
apxm-core.workspace = true

[features]
default = []
driver = [
    "tokio/rt-multi-thread",
    "tokio/io-std",
    "tokio/io-util",
    "tokio/sync",
    "dep:tracing-subscriber",
    "dep:rusqlite",
]
metrics = ["driver"]
no-trace = ["apxm-core/no-trace"]
