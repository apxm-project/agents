[package]
name = "apxm-cli"
version.workspace = true
edition.workspace = true
build = "build.rs"
publish = false
description = "APxM CLI - minimal compile/run wrapper for the driver"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "apxm"
path = "src/main.rs"

[dependencies]
apxm-client.workspace = true
apxm-core.workspace = true
apxm-ais.workspace = true
apxm-backends.workspace = true
apxm-driver = { workspace = true, optional = true }
apxm-compiler.workspace = true
apxm-artifact = { workspace = true, optional = true }
apxm-backend-registry.workspace = true
apxm-acp.workspace = true
apxm-runtime.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
anyhow.workspace = true
colored.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing-subscriber = { workspace = true, optional = true }
chrono.workspace = true
reqwest = { version = "0.13", features = ["blocking", "stream", "json", "rustls"], default-features = false }
walkdir.workspace = true
tempfile.workspace = true
toml = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
# Phase 14.8.F — rollout/watch CLI deps. apxm-rollout is the durable
# transcript layer; tar+flate2 produce the air-gapped reproducibility
# tarball; futures/tokio-stream drive the SSE byte-stream parser.
apxm-rollout = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
tokio-stream = { workspace = true, optional = true }
tar = { version = "0.4", optional = true }
flate2 = { version = "1.0", optional = true }
crossterm = { version = "0.27", optional = true }

[dev-dependencies]
serde_json.workspace = true
apxm-skill.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "io-util"] }
tempfile.workspace = true

[build-dependencies]
apxm-core.workspace = true

[features]
default = []
driver = [
    "dep:apxm-driver",
    "tokio/rt-multi-thread",
    "tokio/io-std",
    "tokio/io-util",
    "tokio/sync",
    "dep:apxm-artifact",
    "dep:tracing-subscriber",
    "dep:rusqlite",
    "dep:toml",
    "dep:apxm-rollout",
    "dep:futures",
    "dep:tokio-stream",
    "dep:tar",
    "dep:flate2",
    "dep:crossterm",
]
metrics = ["driver", "apxm-driver/metrics"]
no-trace = ["apxm-driver/no-trace", "apxm-core/no-trace"]
