[package]
name = "apxm-cli"
version.workspace = true
edition.workspace = true
build = "build.rs"
publish = false
description = "APxM CLI - canonical local and remote APXM command surface"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "apxm"
path = "src/main.rs"

[dependencies]
apxm-core.workspace = true
apxm-ais.workspace = true
apxm-program.workspace = true
apxm-compilation-client.workspace = true
apxm-interaction-client.workspace = true
clap.workspace = true
anyhow.workspace = true
colored.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing-subscriber = { workspace = true, optional = true }
walkdir.workspace = true
tempfile.workspace = true
toml.workspace = true
sha2.workspace = true
regex.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
toml.workspace = true

[build-dependencies]
apxm-core.workspace = true

[features]
default = []
driver = ["dep:tracing-subscriber"]
metrics = ["driver"]
no-trace = ["apxm-core/no-trace"]
