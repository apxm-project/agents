[package]
name = "apxm-cli"
version.workspace = true
edition.workspace = true
build = "build.rs"
publish = false
description = "APxM CLI - canonical local and remote APXM command surface"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "apxm"
path = "src/main.rs"

[[bin]]
name = "apxm-dev"
path = "src/dev_main.rs"
required-features = ["dev"]

[[test]]
name = "canonical_execute"
required-features = ["dev"]

[[test]]
name = "canonical_capability_execute"
required-features = ["dev"]

[[test]]
name = "canonical_skill_execute"
required-features = ["dev"]

[dependencies]
apxm-core.workspace = true
apxm-ais.workspace = true
apxm-backends.workspace = true
apxm-program.workspace = true
apxm-capability = { workspace = true, optional = true }
apxm-source-port = { workspace = true, optional = true }
apxm-execution = { workspace = true, optional = true }
apxm-runtime-service.workspace = true
apxm-runtime-protocol.workspace = true
apxm-compilation-service.workspace = true
apxm-compilation-protocol.workspace = true
apxm-compilation-client.workspace = true
apxm-interaction-client.workspace = true
apxm-inference = { workspace = true, optional = true }
apxm-kernel = { workspace = true, optional = true }
apxm-backend-registry.workspace = true
clap.workspace = true
# `process` and `sync` carry the private package-handler worker adapter: the
# composition root spawns one long-lived helper over piped stdio and serializes
# its frames behind an async lock.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "process", "sync"] }
async-trait.workspace = true
anyhow.workspace = true
colored.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing-subscriber = { workspace = true, optional = true }
chrono.workspace = true
reqwest = { version = "0.13", features = ["blocking", "stream", "json", "rustls"], default-features = false }
walkdir.workspace = true
tempfile.workspace = true
toml.workspace = true
# agent new/sync/lint/build/install manifest parsing + integrity hash chain.
sha2.workspace = true
# Compiles the apxm.agent contract's `files` patternProperties into the
# recognized-path predicate, so the folder contract is derived and not restated.
regex.workspace = true
rusqlite = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "io-util"] }
tempfile.workspace = true
toml.workspace = true

[build-dependencies]
apxm-core.workspace = true

[features]
default = []
dev = [
    "dep:apxm-execution",
    "dep:apxm-kernel",
    "dep:apxm-source-port",
    "dep:apxm-capability",
    "dep:apxm-inference",
]
driver = [
    "tokio/rt-multi-thread",
    "tokio/io-std",
    "tokio/io-util",
    "tokio/sync",
    "dep:tracing-subscriber",
    "dep:rusqlite",
]
metrics = ["driver"]
no-trace = ["apxm-core/no-trace"]
