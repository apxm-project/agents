[package]
name = "apxm-cli"
version.workspace = true
edition.workspace = true
build = "build.rs"
publish = false
description = "APxM CLI - canonical local and remote APXM command surface"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "apxm"
path = "src/main.rs"

[[bin]]
name = "apxm-reference-host"
path = "src/bin/reference_host.rs"

[dependencies]
# Typed apxm-server HTTP client (folded in from the former standalone
# apxm-client crate, - no consumer outside this binary).
progenitor-client.workspace = true
apxm-core.workspace = true
apxm-ais.workspace = true
apxm-backends.workspace = true
apxm-program.workspace = true
apxm-execution.workspace = true
apxm-inference.workspace = true
apxm-kernel.workspace = true
apxm-backend-registry.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
async-trait.workspace = true
anyhow.workspace = true
colored.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing-subscriber = { workspace = true, optional = true }
chrono.workspace = true
reqwest = { version = "0.13", features = ["blocking", "stream", "json", "rustls"], default-features = false }
walkdir.workspace = true
tempfile.workspace = true
toml.workspace = true
# agent new/sync/lint/build/install manifest parsing + integrity hash chain.
sha2.workspace = true
rusqlite = { workspace = true, optional = true }
# Phase 14.8.F â- rollout/watch CLI deps. apxm-rollout is the durable
# transcript layer; tar+flate2 produce the air-gapped reproducibility
# tarball; futures/tokio-stream drive the SSE byte-stream parser.
apxm-rollout = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
tokio-stream = { workspace = true, optional = true }
tar = { version = "0.4", optional = true }
flate2 = { version = "1.0", optional = true }
crossterm = { version = "0.27", optional = true }

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "io-util"] }
tempfile.workspace = true
toml.workspace = true

[build-dependencies]
apxm-core.workspace = true
# apxm-server client codegen (folded in from apxm-client, ).
progenitor.workspace = true
openapiv3.workspace = true
serde_yaml.workspace = true
prettyplease = "0.2"
syn = "2.0"

[features]
default = []
driver = [
    "tokio/rt-multi-thread",
    "tokio/io-std",
    "tokio/io-util",
    "tokio/sync",
    "dep:tracing-subscriber",
    "dep:rusqlite",
    "dep:apxm-rollout",
    "dep:futures",
    "dep:tokio-stream",
    "dep:tar",
    "dep:flate2",
    "dep:crossterm",
]
metrics = ["driver"]
no-trace = ["apxm-core/no-trace"]
