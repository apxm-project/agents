# Default sidecar triggers for the discord-project-curate skill.
#
# apxm-os reads this file; apxm-server ignores it. Same schema as an agent
# manifest [[cue]] (apxm-os crates/os-core Cue), but every entry needs a stable
# `id` so a reload can diff the trigger set instead of replacing it.
#
# This sidecar declares HOW the curate skill expects to be armed: a Discord
# channel cue, curating (default mode) every human message into project memory.
# `channel_id` is deployment-specific — an agents.d/ manifest supplies the real
# value (see apxm-os examples/agents.d/discord-project-listener.toml). The
# `filter` drops bot-authored messages so the agent only learns from people.
#
# The companion `discord-project-answer` skill is query-driven (invoked by the
# agent's `answer` POST on a question), not cue-armed, so it ships no trigger.

[[trigger]]
id         = "channel-curate"
kind       = "channel"
provider   = "discord"
channel_id = "REPLACE_WITH_CHANNEL_ID"
filter     = { when = [ { path = "author.bot", equals = false } ] }
