[package]
name = "apxm-server"
version.workspace = true
publish = false
edition.workspace = true
build = "build.rs"
description = "HTTP API wrapper for APXM runtime"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "apxm-mcp-server"
path = "src/bin/apxm_mcp.rs"

[dependencies]
apxm-ais.workspace = true
apxm-acp.workspace = true
apxm-artifact.workspace = true
apxm-compiler.workspace = true
apxm-core.workspace = true
apxm-skill.workspace = true
apxm-backends.workspace = true
apxm-credentials.workspace = true
apxm-driver.workspace = true
apxm-rollout.workspace = true
apxm-runtime = { workspace = true, features = ["metrics"] }
chrono.workspace = true
anyhow.workspace = true
blake3.workspace = true
reqwest.workspace = true
async-trait.workspace = true
dashmap.workspace = true
rusqlite.workspace = true
uuid.workspace = true
async-stream.workspace = true
axum.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
shell-words = "1.1"
toml.workspace = true
mimalloc = { version = "0.1", default-features = false }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "signal", "time"] }
tokio-stream = { workspace = true, features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { workspace = true, features = ["cors", "trace", "request-id", "set-header"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
http-body-util = "0.1"
tempfile.workspace = true

[build-dependencies]
apxm-core.workspace = true
