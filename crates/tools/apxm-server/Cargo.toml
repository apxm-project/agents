[package]
name = "apxm-server"
version.workspace = true
edition.workspace = true
description = "HTTP API wrapper for APXM runtime"

[lints]
workspace = true

[[bin]]
name = "apxm-mcp-server"
path = "src/bin/apxm_mcp.rs"

[dependencies]
apxm-artifact.workspace = true
apxm-compiler.workspace = true
apxm-core.workspace = true
apxm-backends.workspace = true
apxm-credentials.workspace = true
apxm-runtime = { workspace = true, features = ["metrics"] }
anyhow.workspace = true
reqwest.workspace = true
async-trait.workspace = true
dashmap.workspace = true
uuid.workspace = true
async-stream.workspace = true
axum.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "signal", "time"] }
tokio-stream.workspace = true
tower = { version = "0.5", features = ["util"] }
tower-http = { workspace = true, features = ["cors", "trace", "request-id", "set-header"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
http-body-util = "0.1"
