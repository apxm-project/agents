[package]
name = "apxm-runtime"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
apxm-core.workspace = true
apxm-backends.workspace = true
apxm-artifact.workspace = true

# Async
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "rt", "process", "io-util", "fs"] }
async-trait.workspace = true
futures.workspace = true
tokio-stream.workspace = true

# Concurrency
crossbeam-deque.workspace = true
dashmap = { workspace = true, optional = true }
parking_lot.workspace = true

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
jsonschema.workspace = true

# Observability
tracing.workspace = true

# HTTP
reqwest.workspace = true

# Utilities
once_cell.workspace = true
uuid.workspace = true
chrono.workspace = true
num_cpus = "1.0"
priority-queue = "1.0"
regex.workspace = true
tempfile.workspace = true
termimad = "0.30"
dirs.workspace = true
toml.workspace = true
rusqlite = { workspace = true, optional = true }

[features]
default = ["dashmap", "sqlite"]
dashmap = ["dep:dashmap"]
sqlite = ["dep:rusqlite"]
metrics = ["apxm-backends/metrics"]
no-trace = ["apxm-core/no-trace"]
python_tools_integration = []
test-utils = []

[dev-dependencies]
wiremock = "0.6"
