[package]
name = "apxm-capability"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
apxm-core.workspace = true
apxm-aam.workspace = true
apxm-backends.workspace = true
apxm-capability-iface.workspace = true

# Async
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "rt", "process", "io-util", "fs"] }
async-trait.workspace = true

# Concurrency
dashmap.workspace = true
parking_lot.workspace = true

# Error handling
thiserror.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Observability
tracing.workspace = true

# HTTP
reqwest.workspace = true
base64 = "0.22"
blake3 = { workspace = true }

# Utilities
once_cell.workspace = true
uuid.workspace = true
chrono.workspace = true
rusqlite = { workspace = true, optional = true }

[features]
default = ["sqlite"]
sqlite = ["dep:rusqlite"]

[dev-dependencies]
wiremock = "0.6"
tempfile.workspace = true
