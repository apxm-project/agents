[package]
name = "apxm-capability"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
apxm-core.workspace = true
apxm-backends.workspace = true
apxm-capability-iface.workspace = true
# The skill capabilities hold every discovery root they serve against the
# published `apxm.skill-discovery-root` contract, whose reader lives here.
apxm-program.workspace = true

# Async
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "rt", "process", "io-util", "fs"] }
async-trait.workspace = true

# Concurrency
dashmap.workspace = true
parking_lot.workspace = true

# Error handling
thiserror.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Observability
tracing.workspace = true

# HTTP
reqwest.workspace = true
base64 = "0.22"
blake3 = { workspace = true }
sha2.workspace = true

# Utilities
uuid.workspace = true
chrono.workspace = true

[dev-dependencies]
wiremock = "0.6"
tempfile.workspace = true
