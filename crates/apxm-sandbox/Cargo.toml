[package]
name = "apxm-sandbox"
version.workspace = true
edition.workspace = true
description = "APXM Sandbox - Platform-agnostic execution isolation interface"

[dependencies]
async-trait = "0.1"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

[dev-dependencies]
tokio = { version = "1.0", features = ["full", "test-util"] }
parking_lot = "0.12"
