[package]
name = "apxm-observability"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false
description = "Shared telemetry bootstrap for every APXM service: uniform JSON logging, OTLP trace export, and W3C traceparent extraction/propagation."

[lints]
workspace = true

[dependencies]
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-opentelemetry.workspace = true
opentelemetry.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
http.workspace = true
# CM-3 typed permission-decision vocabulary — metric labels must go through
# `PermissionDecisionKind::as_str()` etc, never ad-hoc strings (OBS-4
# decision-5). `apxm-core` has no dependency back on this crate, so this is
# not a cycle.
apxm-core.workspace = true

# Optional: outgoing-request header injection helpers for services that call
# other services over HTTP (server -> os relay, studio -> server/auth/os).
reqwest = { workspace = true, optional = true }

[dev-dependencies]
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[features]
default = []
reqwest = ["dep:reqwest"]
