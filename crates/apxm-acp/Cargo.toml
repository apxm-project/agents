[package]
name = "apxm-acp"
version = "0.1.0"
edition = "2024"
publish = false
description = "ACP (Agent Client Protocol) client for APXM — spawn and orchestrate coding agents via JSON-RPC over stdio"

[dependencies]
apxm-core = { path = "../apxm-core" }
apxm-runtime = { path = "../apxm-runtime" }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["process", "io-util", "time", "sync"] }
tracing = "0.1"
thiserror = "2.0"
dirs = "5.0"
toml = "0.9"
shell-words = "1.1"
dashmap = "6.0"
uuid = { version = "1.0", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
apxm-credentials = { path = "../apxm-credentials" }

[dev-dependencies]
tempfile = "3.0"
tokio = { version = "1.0", features = ["test-util", "macros", "rt-multi-thread"] }
