[package]
name = "apxm-cli"
version = "0.1.0"
edition = "2024"
publish = false

description = "APxM CLI - minimal compile/run wrapper for the driver"

[[bin]]
name = "apxm"
path = "src/main.rs"

[dependencies]
apxm-core = { path = "../apxm-core" }
apxm-frontend = { path = "../apxm-frontend/rust" }
apxm-driver = { path = "../apxm-driver", optional = true }
apxm-compiler = { path = "../apxm-compiler", optional = true }
apxm-artifact = { path = "../apxm-artifact", optional = true }
apxm-graph = { path = "../apxm-graph" }
clap = { version = "4.0", features = ["derive"] }
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "macros"] }
anyhow = "1.0"
colored = "3.0"
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], optional = true }
apxm-events = { path = "../apxm-events" }
apxm-credentials = { path = "../apxm-credentials" }
apxm-acp = { path = "../apxm-acp" }
apxm-runtime = { path = "../apxm-runtime" }
rpassword = "7.0"
chrono = "0.4"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false }
walkdir = "2.0"
tempfile = "3.0"
rusqlite = { version = "0.32", optional = true }

[dev-dependencies]
serde_json = "1.0"

[features]
default = []
driver = ["dep:apxm-driver", "dep:apxm-compiler", "tokio/rt-multi-thread", "dep:apxm-artifact", "dep:tracing-subscriber", "dep:rusqlite"]
metrics = ["driver", "apxm-driver/metrics"]
# Compile out all tracing for zero overhead (propagates through chain)
no-trace = ["apxm-driver/no-trace", "apxm-core/no-trace"]
