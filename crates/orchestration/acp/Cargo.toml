[package]
name = "apxm-acp"
version.workspace = true
edition.workspace = true
publish = false
description = "ACP (Agent Client Protocol) client for APXM — spawn and coordinate coding agents via JSON-RPC over stdio"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
apxm-core.workspace = true
apxm-runtime.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "time", "sync"] }
tracing.workspace = true
thiserror.workspace = true
dirs.workspace = true
toml.workspace = true
shell-words = "1.1"
dashmap.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
apxm-credentials.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
