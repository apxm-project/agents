[package]
name = "apxm-driver"
version.workspace = true
edition.workspace = true
publish = false
description = "APxM Driver - Configuration, linker, and coordination for compiler/runtime"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
apxm-core.workspace = true
apxm-compiler.workspace = true
apxm-runtime.workspace = true
apxm-artifact.workspace = true
apxm-backends.workspace = true
apxm-backend-registry.workspace = true
apxm-acp.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "process", "io-util"] }
async-trait.workspace = true
futures.workspace = true
thiserror.workspace = true
dirs.workspace = true
tempfile.workspace = true
parking_lot.workspace = true
tracing.workspace = true
chrono.workspace = true
uuid.workspace = true

[features]
metrics = ["apxm-runtime/metrics", "apxm-backends/metrics"]
no-trace = ["apxm-runtime/no-trace", "apxm-core/no-trace"]
