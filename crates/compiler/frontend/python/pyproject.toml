[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apxm"
version = "0.1.0"
description = "Python frontend for APXM graph construction, AIR emission, and workflow execution"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "The APXM authors" }]
keywords = ["apxm", "workflows", "graphs", "agents", "mlir"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["tomli>=2.0; python_version<'3.11'"]

[project.urls]
Homepage = "https://github.com/apxm-project/agents"
Repository = "https://github.com/apxm-project/agents"
Issues = "https://github.com/apxm-project/agents/issues"
Documentation = "https://github.com/apxm-project/agents/tree/main/docs"
Changelog = "https://github.com/apxm-project/agents/releases"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]
server = ["httpx>=0.25"]
stream = ["httpx>=0.25", "httpx-sse>=0.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["apxm", "apxm.*"]

[tool.setuptools.package-data]
apxm = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
