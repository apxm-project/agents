[package]
name = "apxm-compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
apxm-core.workspace = true
apxm-ais.workspace = true
apxm-program.workspace = true
serde.workspace = true
anyhow.workspace = true

[dev-dependencies]
insta.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[features]
# The only switch that links the native AIS dialect. With `mlir`, `build.rs`
# locates MLIR/LLVM, runs CMake and generates bindings with bindgen, and the
# MLIR-dependent tests compile in. Without it the crate builds against stub FFI
# bindings and needs no MLIR, LLVM, libclang, CMake or Ninja on the host — which
# is what lets a service-only toolchain (Rust, Python, Node) build the whole
# workspace. No crate depends on `apxm-compiler`, so nothing else in the
# workspace observes the difference.
mlir = ["dep:bindgen"]

[build-dependencies]
anyhow.workspace = true
apxm-core.workspace = true
apxm-ais.workspace = true
bindgen = { version = "0.72", optional = true }
tracing.workspace = true
