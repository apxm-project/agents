# APXM — dekk agents install

[project]
name = "agents"
description = "MLIR compiler and runtime for agent graphs"

[environment]
type = "conda"
path = "{project}/.dekk/env"
name = "apxm"
channels = ["conda-forge"]

[environment.packages]
mlir = "22"
libclang13 = "22"
clang = "22"
gxx_linux-64 = ""
python = "3.11"
pytest = ""
pytest-asyncio = ""
cmake = ""
ninja = ""
uv = ""
nodejs = "22"

[tools]
cmake = { command = "cmake", version = ">=3.20" }
ninja = { command = "ninja" }
cargo = { command = "cargo", version = ">=1.70" }
python = { command = "python", version = ">=3.10" }
uv = { command = "uv" }

[env]
LLM_GATEWAY_KEY = "env:LLM_GATEWAY_KEY"

MLIR_DIR = "{environment}/lib/cmake/mlir"
LLVM_DIR = "{environment}/lib/cmake/llvm"
MLIR_PREFIX = "{environment}"
LLVM_PREFIX = "{environment}"
CC = "{environment}/bin/x86_64-conda-linux-gnu-gcc"
CXX = "{environment}/bin/x86_64-conda-linux-gnu-g++"
CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER = "{environment}/bin/clang"
# Intentionally NOT setting APXM_HOME: it's the user data root
# (default ~/.apxm), and pinning it to {project} broke roaming-bucket
# resolution. Override per-shell or via .apxm/config.toml instead.
PYTHONPATH = "{project}/crates/compiler/frontend/python:{project}/tools"
APXM_TYPESCRIPT_FRONTEND_PACKAGE = "{project}/crates/compiler/frontend/typescript"
APXM_TYPESCRIPT_AGENT_PACKAGING_PACKAGE = "{project}/crates/tools/cli/agent-packaging"
LD_LIBRARY_PATH = "{project}/target/release/lib:{project}/target/release:{environment}/lib"

[paths]
bin = ["{project}/bin", "{project}/target/release", "{home}/.cargo/bin"]
lib = ["{project}/target/release/lib", "{environment}/lib"]

[commands]
build = { run = "python tools/scripts/cargo.py build -p apxm-cli --features driver,metrics --release", description = "Build the APXM CLI", skill = true, group = "Build & Test" }
build-dialect = { run = "python tools/scripts/cargo.py build-dialect", description = "Rebuild MLIR dialect (TableGen + C++ + Rust) after editing .td or .cpp files", skill = true, group = "Build & Test" }
test = { run = "python -m unittest discover -s tools/tests -p test_offline_prompt_evaluation.py && python -m unittest discover -s tools/tests -p test_observed_prompt_evaluation.py && python -m unittest discover -s tools/tests -p test_release_privacy.py && python tools/scripts/check_frontend_parity.py && python tools/scripts/cargo.py test --workspace --exclude apxm-compiler --exclude apxm-cli && python -m pytest crates/compiler/frontend/python/tests_program -q", description = "Run evaluator evidence validation, release privacy, frontend parity checks, workspace tests, and canonical authoring tests", skill = true, group = "Build & Test" }
test-compiler = { run = "python tools/scripts/cargo.py test -p apxm-compiler", description = "Run compiler AIR builder and pipeline tests", group = "Build & Test" }
test-source-port = { run = "python tools/scripts/cargo.py test -p apxm-source-port", description = "Run Server-callable source-bundle compiler port conformance", group = "Build & Test" }
test-program = { run = "python tools/scripts/cargo.py test -p apxm-program", description = "Run Agent Program artifact and lowering conformance", group = "Build & Test" }
test-kernel = { run = "python tools/scripts/cargo.py test -p apxm-kernel", description = "Run atomic execution commit and lifecycle conformance", group = "Build & Test" }
test-commit-local = { run = "python tools/scripts/cargo.py test -p apxm-commit-local && python -m unittest tools.tests.test_p018_no_hosted_durable", description = "Run P-018 owner-local commit adapters and hosted-absence proof", group = "Build & Test" }
verify-p018-no-hosted-durable = { run = "python tools/scripts/verify_p018_no_hosted_durable.py", description = "Verify the checked-in P-018 no-build dossier, digests, and default-branch authority text", group = "Build & Test" }
test-runtime-seams = { run = "python tools/scripts/cargo.py test -p apxm-inference -p apxm-execution", description = "Run focused model inference and execution runtime conformance", group = "Build & Test" }
test-execution = { run = "python tools/scripts/cargo.py build -p apxm-frontend-python -p apxm-frontend-typescript --release && python tools/scripts/install_frontend_native.py python && npm --prefix crates/compiler/frontend/typescript run build && python tools/scripts/install_frontend_native.py typescript && python tools/scripts/cargo.py test -p apxm-execution", description = "Run public-authored generic structural runtime conformance", group = "Build & Test" }
test-all = { run = "python tools/scripts/cargo.py test --workspace", description = "All tests (requires MLIR)", group = "Build & Test" }
test-cli = { run = "npm --prefix crates/tools/cli/agent-packaging ci --ignore-scripts --no-audit --no-fund && python tools/scripts/cargo.py test -p apxm-cli --features driver,metrics --release", description = "Run CLI tests with agent-packaging dependencies", group = "Build & Test" }
test-python-frontend = { run = "python tools/scripts/cargo.py build -p apxm-frontend-python --release && python tools/scripts/install_frontend_native.py python && APXM_SKIP_NATIVE_BUILD=1 python -m pytest crates/compiler/frontend/python/tests_program/test_generic_frontend.py crates/compiler/frontend/python/tests_program/test_packed_package.py -q", description = "Run generic Python frontend and packed-wheel tests", group = "Build & Test" }
test-typescript-frontend = { run = "npm --prefix crates/compiler/frontend/typescript ci --ignore-scripts --no-audit --no-fund && npm --prefix crates/compiler/frontend/typescript run typecheck && python tools/scripts/cargo.py build -p apxm-frontend-typescript --release && npm --prefix crates/compiler/frontend/typescript run build && python tools/scripts/install_frontend_native.py typescript && npm --prefix crates/compiler/frontend/typescript test", description = "Install the locked frontend dependencies, then run generic TypeScript frontend and packed-package tests", group = "Build & Test" }
test-external-source-package = { run = "python tools/scripts/cargo.py build -p apxm-frontend-typescript --release && npm --prefix crates/compiler/frontend/typescript run build && python tools/scripts/install_frontend_native.py typescript && python tools/scripts/check_external_typescript_package.py tools/tests/fixtures/external-typescript-package", description = "Compile an external TypeScript Agent Program package through the public frontend", group = "Build & Test" }
test-source-compiler-acceptance = { run = "python tools/scripts/check_source_compiler_acceptance.py --report-json .apxm/compiler/source-compiler-acceptance/report.json", description = "Run the focused source/frontend/compiler acceptance gates and write one structured report", group = "Build & Test" }
test-handler-packaging = { run = "npm --prefix crates/tools/cli/agent-packaging test", description = "Run private TypeScript handler-packaging API conformance", group = "Build & Test" }
test-frontend-examples = { run = "python tools/scripts/cargo.py build -p apxm-frontend-python -p apxm-frontend-typescript --release && python tools/scripts/install_frontend_native.py python && npm --prefix crates/compiler/frontend/typescript run build && python tools/scripts/install_frontend_native.py typescript && rm -rf .apxm/frontend-example-python .apxm/frontend-example-packages && mkdir -p .apxm/frontend-example-python .apxm/frontend-example-packages && python -m pip wheel --no-deps --no-build-isolation --wheel-dir .apxm/frontend-example-packages crates/compiler/frontend/python && python -m pip install --no-deps --target .apxm/frontend-example-python .apxm/frontend-example-packages/*.whl && npm --prefix examples/agents/conversational install --ignore-scripts --no-audit --no-fund --no-package-lock && npm --prefix examples/agents/conversational run build && npm --prefix examples/agents/conversational run build:python && npm --prefix examples/agents/conversational run compile >/dev/null && npm --prefix examples/agents/conversational run run >/dev/null && PYTHONPATH=\"$PWD/.apxm/frontend-example-python\" npm --prefix examples/agents/conversational run compile:python >/dev/null && PYTHONPATH=\"$PWD/.apxm/frontend-example-python\" npm --prefix examples/agents/conversational run run:python >/dev/null && npm --prefix examples/agents/coder install --ignore-scripts --no-audit --no-fund --no-package-lock && npm --prefix examples/agents/coder run build && npm --prefix examples/agents/coder run compile >/dev/null && npm --prefix examples/agents/coder run run >/dev/null && PYTHONPATH=.apxm/frontend-example-python python -m pytest examples/agents/conversational/tests/test_parity.py -q && python examples/agents/coder/tests/acceptance.py", description = "Build, compile, run, and validate the conversational and Coder repository examples", group = "Build & Test" }
build-frontend-native = { run = "python tools/scripts/cargo.py build -p apxm-frontend-python --release && python tools/scripts/install_frontend_native.py python", description = "Build the canonical PyO3 authoring bridge (_native.so) reproducibly from source", group = "Build & Test" }
build-example-artifacts = { run = "python tools/scripts/cargo.py build -p apxm-frontend-python -p apxm-frontend-typescript --release && python tools/scripts/install_frontend_native.py python && npm --prefix crates/compiler/frontend/typescript run build && python tools/scripts/install_frontend_native.py typescript && npm --prefix examples/agents/conversational install --ignore-scripts --no-audit --no-fund --no-package-lock && npm --prefix examples/agents/conversational run build && python tools/scripts/build_example_artifacts.py --python-package-root crates/compiler/frontend/python", description = "Build deterministic repository example executable artifacts from installed generic frontends", group = "Build & Test" }
check-example-artifacts = { run = "python tools/scripts/build_example_artifacts.py --python-package-root crates/compiler/frontend/python --check", description = "Drift-check repository example executable artifacts", group = "Build & Test" }
test-canonical-only = { run = "python -m unittest tools.tests.test_canonical_only_reachability", description = "Reject retired execution surfaces from the build graph", group = "Build & Test" }
test-owner-gates = { run = "python -m unittest tools.tests.test_owner_gate_commands tools.tests.test_owner_descriptor_reference_host", description = "Prove owner-lane gates resolve to declared commands and the Host SDK reference cohort is exact", group = "Build & Test" }
test-dekk-cli-wrapper = { run = "python -m unittest tools.tests.test_dekk_cli_wrapper", description = "Run exact APXM CLI wrapper target-selection and native-toolchain readiness guards", group = "Build & Test" }
test-reference-host = { run = "python -m unittest tools.tests.test_owner_descriptor_reference_host tools.tests.test_reference_host_build_receipt tools.tests.test_reference_host_startup_input tools.tests.test_reference_host_lifecycle_receipt tools.tests.test_dekk_cli_wrapper && python tools/scripts/cargo.py test -p apxm-cli --test reference_host_jsonl --release", description = "Run exact reference-host provenance, startup-input, lifecycle receipt, wrapper, and JSONL lifecycle checks", group = "Build & Test" }
frontend-cli-path = { run = "python tools/scripts/cargo.py build -p apxm-cli --bin apxm >/dev/null && target_dir=$(python tools/scripts/cargo.py target-dir) && printf '%s/debug/apxm\\n' \"$target_dir\"", description = "Build the debug APXM CLI and print its path for frontend integration tests", group = "Build & Test" }
frontend-typescript-package-path = { run = "python tools/scripts/cargo.py build -p apxm-frontend-typescript --release >/dev/null && npm --prefix crates/compiler/frontend/typescript run build >/dev/null && python tools/scripts/install_frontend_native.py typescript && printf '%s/crates/compiler/frontend/typescript\\n' \"$PWD\"", description = "Build the TypeScript frontend package and print its path for frontend integration tests", group = "Build & Test" }
check-frontend-parity = { run = "python tools/scripts/check_frontend_parity.py", description = "Prove Python/TypeScript frontends emit closed-semantics-equivalent AIR (source maps may differ by language)", group = "Build & Test" }
check-frontend-surface = { run = "python tools/scripts/check_frontend_surface.py", description = "Prove authoring-package exports and teaching imports match the frontend-surface manifest", group = "Build & Test" }
check = { run = "python3 tools/scripts/generate_contract_bindings.py --check && python tools/scripts/cargo.py run -p apxm-cli --bin apxm -- codegen op-spec --check && python tools/scripts/cargo.py run -p apxm-cli --bin apxm -- codegen frontend --check && python tools/scripts/cargo.py run -p apxm-cli --bin apxm -- codegen typescript --check && python tools/scripts/cargo.py run -p apxm-cli --bin apxm -- codegen typescript-frontend --check && python tools/scripts/cargo.py run -p apxm-cli --bin apxm -- codegen event-kinds --check && python tools/scripts/check_frontend_parity.py && python tools/scripts/check_frontend_surface.py && python tools/scripts/cargo.py check --workspace", description = "Check public seams, generated metadata, frontend parity, manifest alignment, and compiler types", group = "Build & Test" }
fmt = { run = "python tools/scripts/cargo.py fmt", description = "Format Rust sources (cargo fmt)", group = "Build & Test" }
clippy = { run = "python tools/scripts/cargo.py clippy -- -D warnings", description = "Lint Rust sources, denying warnings (cargo clippy)", group = "Build & Test" }
clean = { run = "python tools/scripts/cargo.py clean", description = "Clean", group = "Build & Test" }
scrub-rustc-cache = { run = "python tools/scripts/cargo.py scrub-sigbus-cache", description = "Remove stale rustc SIGBUS diagnostics from Cargo caches", group = "Build & Test" }
stop = { run = "python tools/scripts/apxm_cli.py process stop", description = "Stop canonical APXM CLI job processes", group = "Configuration" }
clean-processes = { run = "python tools/scripts/apxm_cli.py process stop", description = "Stop APXM job processes without cleaning build outputs", group = "Configuration" }

codegen = { run = "python tools/scripts/cargo.py run -p apxm-cli --bin apxm --no-default-features -- codegen op-spec && python tools/scripts/cargo.py run -p apxm-cli --bin apxm --no-default-features -- codegen frontend && python tools/scripts/cargo.py run -p apxm-cli --bin apxm --no-default-features -- codegen typescript && python tools/scripts/cargo.py run -p apxm-cli --bin apxm --no-default-features -- codegen typescript-frontend && python tools/scripts/cargo.py run -p apxm-cli --bin apxm --no-default-features -- codegen event-kinds", description = "Regenerate operation catalog, frontend bindings, and event kind metadata", skill = true, group = "Build & Test" }
gen = { run = "python3 tools/scripts/generate_contract_bindings.py", description = "Generate event seam and host manifest bindings from contracts", skill = true, group = "Build & Test" }
check-contract-codegen = { run = "python3 tools/scripts/generate_contract_bindings.py --check", description = "Check event seam and host manifest generated outputs", group = "Build & Test" }
owner-descriptor = { run = "python contracts/tools/validate_owner_descriptor.py", description = "Validate Agents owner schemas, vectors, Port Contract, and descriptor digests", group = "Build & Test" }
test-inference-evidence = { run = "python -m unittest tools.tests.test_inference_evidence_contracts && python contracts/tools/validate_owner_descriptor.py", description = "Validate exact inference binding, lease, immutable usage, diagnostic, and backend-join evidence vectors", group = "Build & Test" }
owner-descriptor-sync = { run = "python contracts/tools/validate_owner_descriptor.py --write-digests && python contracts/tools/validate_owner_descriptor.py", description = "Regenerate and verify Agents owner descriptor digests", group = "Build & Test" }
reference-host-receipt = { run = "python tools/scripts/reference_host_receipt.py", description = "Build the canonical reference-host binary and write an exact receipt under .apxm/reference-host/receipts", group = "Build & Test" }
reference-host-lifecycle-receipt = { run = "python tools/scripts/reference_host_lifecycle_receipt.py", description = "Exercise the canonical reference-host JSONL transport from an explicit startup input and write a typed lifecycle receipt under .apxm/reference-host/receipts", group = "Build & Test" }
reference-host-startup-input = { run = "python tools/scripts/reference_host_startup_input.py", description = "Emit the exact reference-host startup-input artifact under .apxm/reference-host/startup-inputs for one explicit clean owner revision and explicit operator digests", group = "Build & Test" }
check-frontend-codegen = { run = "python tools/scripts/cargo.py run -p apxm-cli --bin apxm --no-default-features -- codegen op-spec --check && python tools/scripts/cargo.py run -p apxm-cli --bin apxm --no-default-features -- codegen frontend --check && python tools/scripts/cargo.py run -p apxm-cli --bin apxm --no-default-features -- codegen typescript --check && python tools/scripts/cargo.py run -p apxm-cli --bin apxm --no-default-features -- codegen typescript-frontend --check && python tools/scripts/cargo.py run -p apxm-cli --bin apxm --no-default-features -- codegen event-kinds --check", description = "Check operation catalog, event kind, and frontend generated metadata for drift", group = "Build & Test" }
codegen-typescript = { run = "python tools/scripts/cargo.py run -p apxm-cli --bin apxm --no-default-features -- codegen typescript", description = "Regenerate TypeScript bindings from Core definitions", skill = true, group = "Build & Test" }
codegen-typescript-frontend = { run = "python tools/scripts/cargo.py run -p apxm-cli --bin apxm --no-default-features -- codegen typescript-frontend", description = "Regenerate @apxm/frontend contract constants from AIS definitions", skill = true, group = "Build & Test" }
codegen-event-kinds = { run = "python tools/scripts/cargo.py run -p apxm-cli --bin apxm --no-default-features -- codegen event-kinds", description = "Regenerate TypeScript event kind constants from Core definitions", skill = true, group = "Build & Test" }
codegen-op-spec = { run = "python tools/scripts/cargo.py run -p apxm-cli --bin apxm --no-default-features -- codegen op-spec", description = "Regenerate the op-spec.v1 AIS operation catalog + vectors fixture", skill = true, group = "Build & Test" }
tokenize = { run = "python tools/scripts/apxm_cli.py tokenize", description = "Report standalone token-accounting availability for text", skill = true, group = "Discovery" }

canonical-air = { run = "python tools/scripts/cargo.py build -p apxm-cli --bin apxm >/dev/null && \"$(python tools/scripts/cargo.py target-dir)/debug/apxm\" canonical-air", description = "Lower apxm.frontend-graph.v1 JSON through the native compiler bridge", skill = true, group = "Compilation" }
compile-service-canonical = { run = "env -u CC -u CXX -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH python tools/scripts/cargo.py build -p apxm-cli --features driver --bin apxm >/dev/null && env -u CC -u CXX -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH python tools/scripts/cargo.py build -p apxm-frontend-python --release >/dev/null && env -u CC -u CXX -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH python tools/scripts/install_frontend_native.py python && env -u CC -u CXX -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH \"$(python tools/scripts/cargo.py target-dir)/debug/apxm\" compile-service-canonical examples/agents/conversational", description = "Compile the canonical source example to apxm.air.v1 JSON", skill = true, group = "Compilation" }
execute-canonical = { run = "env -u CC -u CXX -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH python tools/scripts/cargo.py build -p apxm-cli --bin apxm >/dev/null && env -u CC -u CXX -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH \"$(python tools/scripts/cargo.py target-dir)/debug/apxm\" execute-canonical tools/tests/fixtures/canonical-execute.air.json", description = "Execute the checked-in canonical apxm.air.v1 fixture through the canonical runtime", skill = true, group = "Compilation" }
doctor = { run = "python tools/scripts/apxm_cli.py doctor", description = "Diagnose the APXM toolchain and canonical authoring environment", group = "Configuration" }
commit-lint = { run = "python tools/scripts/check_commit_message.py", description = "Lint a commit message file, --current (HEAD), or --range REV1..REV2", group = "Configuration" }

gui = { run = "python tools/scripts/apxm_cli.py gui", description = "Launch the web-based GUI dashboard", skill = true, group = "Authoring" }
watch = { run = "python tools/scripts/apxm_cli.py watch", description = "Stream a live run's dispatch tree from apxm-server (Phase 14.8.F)", group = "Observability" }
chat = { run = "python tools/scripts/apxm_cli.py chat", description = "Run the APXM conversational REPL over apxm-server", group = "Authoring" }
validate = { run = "python tools/scripts/apxm_cli.py validate", description = "Validate graph against AIS contract", skill = true, group = "Authoring" }
analyze = { run = "python tools/scripts/apxm_cli.py analyze", description = "Analyze parallelism and critical path", group = "Authoring" }
explain = { run = "python tools/scripts/apxm_cli.py explain", description = "Human-readable summary of a graph", group = "Authoring" }
goal = { run = "python tools/scripts/apxm_cli.py goal", description = "Start, follow, inspect, or cancel a bounded APXM goal run", group = "Goals & Workflows" }
offline-prompt-evaluation = { run = "python tools/scripts/offline_prompt_evaluation.py", description = "Validate preregistered prompt-output bundles with classified backend evidence", group = "Evaluation" }
observed-prompt-evaluation = { run = "python tools/scripts/observed_prompt_evaluation.py", description = "Execute preregistered prompt arms and record portable backend evidence", group = "Evaluation" }
test-offline-prompt-evaluation = { run = "python -m unittest discover -s tools/tests -p test_offline_prompt_evaluation.py", description = "Test offline prompt-evaluation evidence validation", group = "Evaluation" }
test-observed-prompt-evaluation = { run = "python -m unittest discover -s tools/tests -p test_observed_prompt_evaluation.py", description = "Test observed backend execution evidence", group = "Evaluation" }
test-release-privacy = { run = "python -m unittest discover -s tools/tests -p test_release_privacy.py -v", description = "Audit every tracked package manifest and release command for private fail-closed publication", group = "Build & Test" }

[commands.session]
description = "Inspect APXM execution session outputs"
group = "Observability"
list = { run = "python tools/scripts/apxm_cli.py session list", description = "List execution sessions" }
inspect = { run = "python tools/scripts/apxm_cli.py session inspect", description = "Show detailed information about a session" }
diff = { run = "python tools/scripts/apxm_cli.py session diff", description = "Compare two sessions" }
clean = { run = "python tools/scripts/apxm_cli.py session clean", description = "Clean old sessions" }

[commands.backend]
description = "Manage registered inference backend endpoints"
group = "Configuration"
add = { run = "python tools/scripts/apxm_cli.py backend add", description = "Register backend endpoint", skill = true }
list = { run = "python tools/scripts/apxm_cli.py backend list", description = "List registered backends" }
remove = { run = "python tools/scripts/apxm_cli.py backend remove", description = "Remove backend registration" }
test = { run = "python tools/scripts/apxm_cli.py backend test", description = "Test connectivity" }
status = { run = "python tools/scripts/apxm_cli.py backend status", description = "Show backend registry status" }
sync-models = { run = "python tools/scripts/apxm_cli.py backend sync-models", description = "Sync installed Ollama models into a backend registration" }
