# APXM — dekk agents install

[project]
name = "agents"
description = "MLIR compiler and runtime for agent graphs"

[environment]
type = "conda"
path = "{project}/.dekk/env"
name = "apxm"
channels = ["conda-forge"]

[environment.packages]
mlir = "22"
libclang13 = "22"
clang = "22"
gxx_linux-64 = ""
python = "3.11"
pytest = ""
pytest-asyncio = ""
cmake = ""
ninja = ""
uv = ""
nodejs = "22"
# The repository's own tooling shells out to `git -C`, which needs git >= 1.8.5.
# Several development hosts carry 1.8.3.1, where that is a usage error, so the
# environment pins a modern git rather than depending on whatever the host ships.
git = ""

[tools]
cmake = { command = "cmake", version = ">=3.20" }
ninja = { command = "ninja" }
cargo = { command = "cargo", version = ">=1.70" }
python = { command = "python", version = ">=3.10" }
uv = { command = "uv" }

[env]
LLM_GATEWAY_KEY = "env:LLM_GATEWAY_KEY"

MLIR_DIR = "{environment}/lib/cmake/mlir"
LLVM_DIR = "{environment}/lib/cmake/llvm"
MLIR_PREFIX = "{environment}"
LLVM_PREFIX = "{environment}"
CC = "{environment}/bin/x86_64-conda-linux-gnu-gcc"
CXX = "{environment}/bin/x86_64-conda-linux-gnu-g++"
CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER = "{environment}/bin/clang"
RUSTUP_HOME = "/opt/shared/rust/2025.10.06"
CARGO_HOME = "/lustre/parot/MiguelRosas/.tools/cargo"
RUSTUP_TOOLCHAIN = "stable"
# Intentionally NOT setting APXM_HOME: it's the user data root
# (default ~/.apxm), and pinning it to {project} broke roaming-bucket
# resolution. Override per-shell or via .apxm/config.toml instead.
PYTHONPATH = "{project}/crates/compiler/frontend/python:{project}/tools"
APXM_TYPESCRIPT_FRONTEND_PACKAGE = "{project}/crates/compiler/frontend/typescript"
APXM_TYPESCRIPT_AGENT_PACKAGING_PACKAGE = "{project}/crates/tools/cli/agent-packaging"
LD_LIBRARY_PATH = "{project}/target/release/lib:{project}/target/release:{environment}/lib"

[paths]
bin = [
	"{project}/bin",
	"{project}/target/release",
	"{home}/.local/bin",
	"/opt/shared/rust/2025.10.06/bin",
	"{home}/.cargo/bin",
]
lib = ["{project}/target/release/lib", "{environment}/lib"]

[commands]
build = { run = "python tools/scripts/cargo.py build -p apxm-cli --features driver,metrics --release", description = "Build the APXM CLI", skill = true, group = "Build & Test" }
build-dialect = { run = "python tools/scripts/cargo.py build-dialect", description = "Rebuild MLIR dialect (TableGen + C++ + Rust) after editing .td or .cpp files", skill = true, group = "Build & Test" }
test = { run = "python tools/scripts/check_frontend_parity.py && python tools/scripts/cargo.py test --workspace --exclude apxm-compiler --exclude apxm-cli && python -m pytest crates/compiler/frontend/python/tests_program -q", description = "Run frontend parity, workspace, and canonical authoring tests", skill = true, group = "Build & Test" }
test-compiler = { run = "env -u CC -u CXX python tools/scripts/cargo.py test -p apxm-compiler", description = "Run compiler AIR builder and pipeline tests", group = "Build & Test" }
test-source-port = { run = "env -u CC -u CXX python tools/scripts/cargo.py test -p apxm-source-port", description = "Run source-bundle compiler port conformance", group = "Build & Test" }
test-program = { run = "env -u CC -u CXX python tools/scripts/cargo.py test -p apxm-program", description = "Run Agent Program artifact and lowering conformance", group = "Build & Test" }
test-program-source = { run = "env -u CC -u CXX python tools/scripts/cargo.py test -p apxm-program --lib --test artifact_conformance --test lower_conformance --test semantic_conformance --test structural_containment", description = "Run source/compiler Agent Program graph, AIR, artifact, and source-map conformance", group = "Build & Test" }
test-kernel = { run = "python tools/scripts/cargo.py test -p apxm-kernel", description = "Run atomic execution commit and lifecycle conformance", group = "Build & Test" }
test-commit-local = { run = "python tools/scripts/cargo.py test -p apxm-commit-local", description = "Run P-018 owner-local commit adapters", group = "Build & Test" }
test-runtime-seams = { run = "python tools/scripts/cargo.py test -p apxm-inference -p apxm-execution", description = "Run focused model inference and execution runtime conformance", group = "Build & Test" }
test-execution = { run = "python tools/scripts/cargo.py build -p apxm-frontend-python -p apxm-frontend-typescript --release && python tools/scripts/install_frontend_native.py python && npm --prefix crates/compiler/frontend/typescript run build && python tools/scripts/install_frontend_native.py typescript && python tools/scripts/cargo.py test -p apxm-execution", description = "Run public-authored generic structural runtime conformance", group = "Build & Test" }
test-all = { run = "python tools/scripts/cargo.py test --workspace", description = "All tests (requires MLIR)", group = "Build & Test" }
test-cli = { run = "npm --prefix crates/tools/cli/agent-packaging ci --ignore-scripts --no-audit --no-fund && python tools/scripts/cargo.py test -p apxm-cli --features driver,metrics --release", description = "Run CLI tests with agent-packaging dependencies", group = "Build & Test" }
test-python-frontend = { run = "env -u CC -u CXX python tools/scripts/cargo.py build -p apxm-frontend-python --release && python tools/scripts/install_frontend_native.py python && APXM_SKIP_NATIVE_BUILD=1 python -m pytest crates/compiler/frontend/python/tests_program/test_frontend_conformance.py crates/compiler/frontend/python/tests_program/test_language_local_frontend.py crates/compiler/frontend/python/tests_program/test_capability_handlers.py crates/compiler/frontend/python/tests_program/test_packed_package.py -q", description = "Run the shared frontend-conformance corpus, the generic Python frontend, and packed-wheel tests", group = "Build & Test" }
test-typescript-frontend = { run = "npm --prefix crates/compiler/frontend/typescript ci --ignore-scripts --no-audit --no-fund && npm --prefix crates/compiler/frontend/typescript run typecheck && env -u CC -u CXX python tools/scripts/cargo.py build -p apxm-frontend-typescript --release && npm --prefix crates/compiler/frontend/typescript run build && python tools/scripts/install_frontend_native.py typescript && npm --prefix crates/compiler/frontend/typescript test", description = "Install the locked frontend dependencies, then run the shared frontend-conformance corpus, generic TypeScript frontend, and packed-package tests", group = "Build & Test" }
test-external-source-package = { run = "env -u CC -u CXX python tools/scripts/cargo.py build -p apxm-frontend-typescript --release && npm --prefix crates/compiler/frontend/typescript run build && python tools/scripts/install_frontend_native.py typescript && python tools/scripts/check_external_typescript_package.py tools/tests/fixtures/external-typescript-package", description = "Compile an external TypeScript Agent Program package through the public frontend", group = "Build & Test" }
test-handler-packaging = { run = "npm --prefix crates/tools/cli/agent-packaging test", description = "Run private TypeScript handler-packaging API conformance", group = "Build & Test" }
test-frontend-examples = { run = "env -u CC -u CXX python tools/scripts/cargo.py build -p apxm-frontend-python -p apxm-frontend-typescript --release && python tools/scripts/install_frontend_native.py python && npm --prefix crates/compiler/frontend/typescript run build && python tools/scripts/install_frontend_native.py typescript && rm -rf .apxm/frontend-example-python .apxm/frontend-example-packages && mkdir -p .apxm/frontend-example-python .apxm/frontend-example-packages && python -m pip wheel --no-deps --no-build-isolation --wheel-dir .apxm/frontend-example-packages crates/compiler/frontend/python && python -m pip install --no-deps --target .apxm/frontend-example-python .apxm/frontend-example-packages/*.whl && npm --prefix examples/agents/conversational install --ignore-scripts --no-audit --no-fund --no-package-lock && npm --prefix examples/agents/conversational run build && npm --prefix examples/agents/conversational run build:python && npm --prefix examples/agents/conversational run compile >/dev/null && npm --prefix examples/agents/conversational run run >/dev/null && PYTHONPATH=\"$PWD/.apxm/frontend-example-python\" npm --prefix examples/agents/conversational run compile:python >/dev/null && PYTHONPATH=\"$PWD/.apxm/frontend-example-python\" npm --prefix examples/agents/conversational run run:python >/dev/null && npm --prefix examples/agents/coder install --ignore-scripts --no-audit --no-fund --no-package-lock && npm --prefix examples/agents/coder run build && npm --prefix examples/agents/coder run compile >/dev/null && npm --prefix examples/agents/coder run run >/dev/null && PYTHONPATH=.apxm/frontend-example-python python -m pytest examples/agents/conversational/tests/test_parity.py -q && python examples/agents/coder/tests/acceptance.py", description = "Build, compile, run, and validate the conversational and Coder repository examples", group = "Build & Test" }
build-frontend-native = { run = "python tools/scripts/cargo.py build -p apxm-frontend-python --release && python tools/scripts/install_frontend_native.py python", description = "Build the canonical PyO3 authoring bridge (_native.so) reproducibly from source", group = "Build & Test" }
build-example-artifacts = { run = "env -u CC -u CXX -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH python tools/scripts/cargo.py build -p apxm-frontend-python -p apxm-frontend-typescript --release && python tools/scripts/install_frontend_native.py python && npm --prefix crates/compiler/frontend/typescript run build && python tools/scripts/install_frontend_native.py typescript && npm --prefix examples/agents/conversational install --ignore-scripts --no-audit --no-fund --no-package-lock && npm --prefix examples/agents/conversational run build && python tools/scripts/build_example_artifacts.py --python-package-root crates/compiler/frontend/python", description = "Build deterministic repository example executable artifacts from installed generic frontends", group = "Build & Test" }
check-example-artifacts = { run = "python tools/scripts/build_example_artifacts.py --python-package-root crates/compiler/frontend/python --check", description = "Drift-check repository example executable artifacts", group = "Build & Test" }
build-agent-packages = { run = "python tools/scripts/agent_packages.py --build", description = "Rebuild every checked-in agent package's integrity chain", group = "Build & Test" }
check-agent-packages = { run = "python tools/scripts/agent_packages.py", description = "Lint every checked-in agent package and verify it against its own integrity chain", group = "Build & Test" }
check-agent-skills = { run = "python tools/scripts/validate_agent_skill.py --root .agents/skills", description = "Validate every checked-in Agent Skill directory the project discovery root publishes", group = "Build & Test" }
test-canonical-only = { run = "python -m unittest tools.tests.test_canonical_only_reachability", description = "Reject retired execution surfaces from the build graph", group = "Build & Test" }
test-dekk-cli-wrapper = { run = "python -m unittest tools.tests.test_dekk_cli_wrapper", description = "Run exact APXM CLI wrapper target-selection and native-toolchain readiness guards", group = "Build & Test" }
frontend-cli-path = { run = "python tools/scripts/cargo.py build -p apxm-cli --bin apxm >/dev/null && target_dir=$(python tools/scripts/cargo.py target-dir) && printf '%s/debug/apxm\\n' \"$target_dir\"", description = "Build the debug APXM CLI and print its path for frontend integration tests", group = "Build & Test" }
frontend-typescript-package-path = { run = "python tools/scripts/cargo.py build -p apxm-frontend-typescript --release >/dev/null && npm --prefix crates/compiler/frontend/typescript run build >/dev/null && python tools/scripts/install_frontend_native.py typescript && printf '%s/crates/compiler/frontend/typescript\\n' \"$PWD\"", description = "Build the TypeScript frontend package and print its path for frontend integration tests", group = "Build & Test" }
check-frontend-parity = { run = "python tools/scripts/check_frontend_parity.py", description = "Prove Python/TypeScript frontends emit closed-semantics-equivalent AIR (source maps may differ by language)", group = "Build & Test" }
check-frontend-surface = { run = "python tools/scripts/check_frontend_surface.py", description = "Prove every language projects the whole frontend surface with the argument shape, generated diagnostics, and documented imports the manifest declares", group = "Build & Test" }
check-deversion = { run = "python tools/scripts/deversion_inventory.py --check", description = "Prove no Agents-owned versioned schema id or filename survived the de-versioning sweep", group = "Build & Test" }
deversion-inventory = { run = "python tools/scripts/deversion_inventory.py", description = "Report every versioned identifier split into Agents-owned and foreign-owner, with file renames and stale path references", group = "Build & Test" }
check = { run = "python tools/scripts/cargo.py run -p apxm-cli --bin apxm -- codegen op-spec --check && python tools/scripts/cargo.py run -p apxm-cli --bin apxm -- codegen frontend --check && python tools/scripts/cargo.py run -p apxm-cli --bin apxm -- codegen typescript --check && python tools/scripts/cargo.py run -p apxm-cli --bin apxm -- codegen typescript-frontend --check && python tools/scripts/cargo.py run -p apxm-cli --bin apxm -- codegen event-kinds --check && python tools/scripts/cargo.py run -p apxm-cli --bin apxm -- codegen capabilities --check && python tools/scripts/cargo.py run -p apxm-cli --bin apxm -- codegen permissions --check && python tools/scripts/cargo.py run -p apxm-cli --bin apxm -- codegen frontend-vocabulary --check && python tools/scripts/cargo.py run -p apxm-cli --bin apxm -- codegen frontend-records --check && python tools/scripts/cargo.py run -p apxm-cli --bin apxm -- codegen frontend-serializers --check && python tools/scripts/cargo.py run -p apxm-cli --bin apxm -- codegen diagnostics --check && python tools/scripts/cargo.py run -p apxm-cli --bin apxm -- codegen frontend-conformance --check && python tools/scripts/check_frontend_parity.py && python tools/scripts/check_frontend_surface.py && python tools/scripts/cargo.py check --workspace", description = "Check generated metadata, frontend parity, manifest alignment, and compiler types", group = "Build & Test" }
fmt = { run = "python tools/scripts/cargo.py fmt", description = "Format Rust sources (cargo fmt)", group = "Build & Test" }
fmt-check = { run = "python tools/scripts/cargo.py fmt -- --check", description = "Fail on any unformatted Rust source without rewriting it (cargo fmt --check)", group = "Build & Test" }
clippy = { run = "python tools/scripts/cargo.py clippy -- -D warnings", description = "Lint Rust sources, denying warnings (cargo clippy)", group = "Build & Test" }
clean = { run = "python tools/scripts/cargo.py clean", description = "Clean", group = "Build & Test" }
scrub-rustc-cache = { run = "python tools/scripts/cargo.py scrub-sigbus-cache", description = "Remove stale rustc SIGBUS diagnostics from Cargo caches", group = "Build & Test" }
stop = { run = "python tools/scripts/apxm_cli.py process stop", description = "Stop canonical APXM CLI job processes", group = "Configuration" }
clean-processes = { run = "python tools/scripts/apxm_cli.py process stop", description = "Stop APXM job processes without cleaning build outputs", group = "Configuration" }

codegen = { run = "python tools/scripts/cargo.py run -p apxm-cli --bin apxm --no-default-features -- codegen op-spec && python tools/scripts/cargo.py run -p apxm-cli --bin apxm --no-default-features -- codegen frontend && python tools/scripts/cargo.py run -p apxm-cli --bin apxm --no-default-features -- codegen typescript && python tools/scripts/cargo.py run -p apxm-cli --bin apxm --no-default-features -- codegen typescript-frontend && python tools/scripts/cargo.py run -p apxm-cli --bin apxm --no-default-features -- codegen event-kinds && python tools/scripts/cargo.py run -p apxm-cli --bin apxm --no-default-features -- codegen capabilities && python tools/scripts/cargo.py run -p apxm-cli --bin apxm --no-default-features -- codegen permissions && python tools/scripts/cargo.py run -p apxm-cli --bin apxm --no-default-features -- codegen frontend-vocabulary && python tools/scripts/cargo.py run -p apxm-cli --bin apxm --no-default-features -- codegen frontend-records && python tools/scripts/cargo.py run -p apxm-cli --bin apxm --no-default-features -- codegen frontend-serializers && python tools/scripts/cargo.py run -p apxm-cli --bin apxm --no-default-features -- codegen diagnostics && python tools/scripts/cargo.py run -p apxm-cli --bin apxm --no-default-features -- codegen frontend-conformance", description = "Regenerate the operation catalog, frontend bindings, event kind metadata, capability catalogue, permission decisions, source graph vocabulary, FrontendGraph contract record types and serializers, authoring diagnostic codes, and the shared frontend-conformance harness", skill = true, group = "Build & Test" }
check-frontend-codegen = { run = "env -u CC -u CXX python tools/scripts/cargo.py run -p apxm-cli --bin apxm --no-default-features -- codegen op-spec --check && env -u CC -u CXX python tools/scripts/cargo.py run -p apxm-cli --bin apxm --no-default-features -- codegen frontend --check && env -u CC -u CXX python tools/scripts/cargo.py run -p apxm-cli --bin apxm --no-default-features -- codegen typescript --check && env -u CC -u CXX python tools/scripts/cargo.py run -p apxm-cli --bin apxm --no-default-features -- codegen typescript-frontend --check && env -u CC -u CXX python tools/scripts/cargo.py run -p apxm-cli --bin apxm --no-default-features -- codegen event-kinds --check && env -u CC -u CXX python tools/scripts/cargo.py run -p apxm-cli --bin apxm --no-default-features -- codegen capabilities --check && env -u CC -u CXX python tools/scripts/cargo.py run -p apxm-cli --bin apxm --no-default-features -- codegen permissions --check && env -u CC -u CXX python tools/scripts/cargo.py run -p apxm-cli --bin apxm --no-default-features -- codegen frontend-vocabulary --check && env -u CC -u CXX python tools/scripts/cargo.py run -p apxm-cli --bin apxm --no-default-features -- codegen frontend-records --check && env -u CC -u CXX python tools/scripts/cargo.py run -p apxm-cli --bin apxm --no-default-features -- codegen frontend-serializers --check && env -u CC -u CXX python tools/scripts/cargo.py run -p apxm-cli --bin apxm --no-default-features -- codegen diagnostics --check && env -u CC -u CXX python tools/scripts/cargo.py run -p apxm-cli --bin apxm --no-default-features -- codegen frontend-conformance --check", description = "Check operation catalog, event kind, capability catalogue, permission decision, source graph vocabulary, FrontendGraph contract record type, record serializer, authoring diagnostic code, frontend-conformance harness, and frontend generated metadata for drift", group = "Build & Test" }
codegen-typescript = { run = "python tools/scripts/cargo.py run -p apxm-cli --bin apxm --no-default-features -- codegen typescript", description = "Regenerate TypeScript bindings from Core definitions", skill = true, group = "Build & Test" }
codegen-typescript-frontend = { run = "python tools/scripts/cargo.py run -p apxm-cli --bin apxm --no-default-features -- codegen typescript-frontend", description = "Regenerate the @apxm/frontend runtime-evidence fact binding from the runtime-evidence contract schema", skill = true, group = "Build & Test" }
codegen-capabilities = { run = "python tools/scripts/cargo.py run -p apxm-cli --bin apxm --no-default-features -- codegen capabilities", description = "Regenerate the Python and TypeScript authoring capability id catalogue from the AIS capability definitions", skill = true, group = "Build & Test" }
codegen-permissions = { run = "python tools/scripts/cargo.py run -p apxm-cli --bin apxm --no-default-features -- codegen permissions", description = "Regenerate the Python and TypeScript authoring permission decision vocabulary from the AIS permission definitions", skill = true, group = "Build & Test" }
codegen-frontend-vocabulary = { run = "python tools/scripts/cargo.py run -p apxm-cli --bin apxm --no-default-features -- codegen frontend-vocabulary", description = "Regenerate the Python and TypeScript source graph vocabulary from the apxm.frontend-graph contract", skill = true, group = "Build & Test" }
codegen-frontend-records = { run = "python tools/scripts/cargo.py run -p apxm-cli --bin apxm --no-default-features -- codegen frontend-records", description = "Regenerate the Python and TypeScript FrontendGraph contract record types from the apxm.frontend-graph contract", skill = true, group = "Build & Test" }
codegen-frontend-serializers = { run = "python tools/scripts/cargo.py run -p apxm-cli --bin apxm --no-default-features -- codegen frontend-serializers", description = "Regenerate the Python and TypeScript FrontendGraph contract record serializers from the apxm.frontend-graph contract", skill = true, group = "Build & Test" }
codegen-diagnostics = { run = "python tools/scripts/cargo.py run -p apxm-cli --bin apxm --no-default-features -- codegen diagnostics", description = "Regenerate the Python and TypeScript authoring diagnostic codes from the apxm.frontend-surface manifest", skill = true, group = "Build & Test" }
codegen-frontend-conformance = { run = "python tools/scripts/cargo.py run -p apxm-cli --bin apxm --no-default-features -- codegen frontend-conformance", description = "Regenerate the shared frontend-conformance corpus harness and its per-language test runner from the apxm.frontend-conformance corpus", skill = true, group = "Build & Test" }
codegen-event-kinds = { run = "python tools/scripts/cargo.py run -p apxm-cli --bin apxm --no-default-features -- codegen event-kinds", description = "Regenerate TypeScript event kind constants from Core definitions", skill = true, group = "Build & Test" }
codegen-op-spec = { run = "python tools/scripts/cargo.py run -p apxm-cli --bin apxm --no-default-features -- codegen op-spec", description = "Regenerate the op-spec AIS operation catalog + vectors fixture", skill = true, group = "Build & Test" }
tokenize = { run = "python tools/scripts/apxm_cli.py tokenize", description = "Report standalone token-accounting availability for text", skill = true, group = "Discovery" }

canonical-air = { run = "python tools/scripts/cargo.py build -p apxm-cli --bin apxm >/dev/null && \"$(python tools/scripts/cargo.py target-dir)/debug/apxm\" canonical-air", description = "Lower apxm.frontend-graph JSON through the native compiler bridge", skill = true, group = "Compilation" }
compile-service-canonical = { run = "env -u CC -u CXX -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH python tools/scripts/cargo.py build -p apxm-cli --features driver --bin apxm >/dev/null && env -u CC -u CXX -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH python tools/scripts/cargo.py build -p apxm-frontend-python --release >/dev/null && env -u CC -u CXX -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH python tools/scripts/install_frontend_native.py python && env -u CC -u CXX -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH \"$(python tools/scripts/cargo.py target-dir)/debug/apxm\" compile-service-canonical examples/agents/conversational", description = "Compile the canonical source example to apxm.air JSON", skill = true, group = "Compilation" }
execute-canonical = { run = "env -u CC -u CXX -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH python tools/scripts/cargo.py build -p apxm-cli --bin apxm >/dev/null && env -u CC -u CXX -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH \"$(python tools/scripts/cargo.py target-dir)/debug/apxm\" execute-canonical tools/tests/fixtures/canonical-execute.air.json --invocation-admission tools/tests/fixtures/canonical-execute.invocation-admission.json --release tools/tests/fixtures/canonical-execute.release.json --provenance tools/tests/fixtures/canonical-execute.provenance.json", description = "Execute the checked-in canonical apxm.air fixture through exact Invocation Admission", skill = true, group = "Compilation" }
doctor = { run = "python tools/scripts/apxm_cli.py doctor", description = "Diagnose the APXM toolchain and canonical authoring environment", group = "Configuration" }
commit-lint = { run = "python tools/scripts/check_commit_message.py", description = "Lint a commit message file, --current (HEAD), or --range REV1..REV2", group = "Configuration" }

validate = { run = "python tools/scripts/apxm_cli.py validate", description = "Validate graph against AIS contract", skill = true, group = "Authoring" }
analyze = { run = "python tools/scripts/apxm_cli.py analyze", description = "Analyze parallelism and critical path", group = "Authoring" }
explain = { run = "python tools/scripts/apxm_cli.py explain", description = "Human-readable summary of a graph", group = "Authoring" }
goal = { run = "python tools/scripts/apxm_cli.py goal", description = "Run a bounded canonical program goal", group = "Goals & Workflows" }

[commands.session]
description = "Inspect APXM execution session outputs"
group = "Observability"
list = { run = "python tools/scripts/apxm_cli.py session list", description = "List execution sessions" }
inspect = { run = "python tools/scripts/apxm_cli.py session inspect", description = "Show detailed information about a session" }
diff = { run = "python tools/scripts/apxm_cli.py session diff", description = "Compare two sessions" }
clean = { run = "python tools/scripts/apxm_cli.py session clean", description = "Clean old sessions" }

[commands.backend]
description = "Manage registered inference backend endpoints"
group = "Configuration"
add = { run = "python tools/scripts/apxm_cli.py backend add", description = "Register backend endpoint", skill = true }
list = { run = "python tools/scripts/apxm_cli.py backend list", description = "List registered backends" }
remove = { run = "python tools/scripts/apxm_cli.py backend remove", description = "Remove backend registration" }
test = { run = "python tools/scripts/apxm_cli.py backend test", description = "Test connectivity" }
status = { run = "python tools/scripts/apxm_cli.py backend status", description = "Show backend registry status" }
sync-models = { run = "python tools/scripts/apxm_cli.py backend sync-models", description = "Sync installed Ollama models into a backend registration" }
add-model = { run = "python tools/scripts/apxm_cli.py backend add-model", description = "Add model to backend" }

[commands.mcp]
description = "Install the APXM MCP server into supported coding-agent configs"
group = "Configuration"
install = { run = "python tools/scripts/apxm_mcp_install.py install", description = "Install apxm-mcp-server into detected agent configs" }
list = { run = "python tools/scripts/apxm_mcp_install.py list", description = "List detected MCP-capable agent configs and APXM install status" }
uninstall = { run = "python tools/scripts/apxm_mcp_install.py uninstall", description = "Remove APXM MCP registration from agent configs" }

[commands.ops]
description = "Browse AIS operations"
group = "Discovery"
list = { run = "python tools/scripts/apxm_cli.py ops list", description = "List all operations" }
show = { run = "python tools/scripts/apxm_cli.py ops show", description = "Show operation details" }
usage = { run = "python tools/scripts/apxm_cli.py ops usage", description = "Show accumulated op-usage counts from real executions" }

[commands.template]
description = "Browse graph templates"
group = "Discovery"
list = { run = "python tools/scripts/apxm_cli.py template list", description = "List templates" }
show = { run = "python tools/scripts/apxm_cli.py template show", description = "Show template" }

[commands.agent]
description = "Scaffold, sync, lint, build, verify, and install agents"
group = "Authoring"
new = { run = "python tools/scripts/apxm_cli.py agent new", description = "Scaffold a new agent folder tree", skill = true }
sync = { run = "python tools/scripts/apxm_cli.py agent sync", description = "Recompile the package's TypeScript handlers", skill = true }
lint = { run = "python tools/scripts/apxm_cli.py agent lint", description = "Validate an agent against the apxm.agent contract", skill = true }
build = { run = "npm --prefix crates/tools/cli/agent-packaging ci --ignore-scripts --no-audit --no-fund && env -u CC -u CXX -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH python tools/scripts/apxm_cli.py agent build", description = "Compile package handlers and recompute agent integrity", skill = true }
verify = { run = "python tools/scripts/apxm_cli.py agent verify", description = "Verify an agent against its generated integrity chain", skill = true }
install = { run = "python tools/scripts/apxm_cli.py agent install", description = "Install a built agent to APXM_HOME/agents/<id>" }

[commands.cache]
description = "Manage the MemoCache (response memoization)"
group = "Configuration"
stats = { run = "python tools/scripts/apxm_cli.py cache stats", description = "Show cache statistics" }
clear = { run = "python tools/scripts/apxm_cli.py cache clear", description = "Clear all cached entries" }
export = { run = "python tools/scripts/apxm_cli.py cache export", description = "Export cache to JSON" }

[commands.process]
description = "Inspect and stop APXM job processes"
group = "Configuration"
list = { run = "python tools/scripts/apxm_cli.py process list", description = "List canonical APXM CLI job processes" }
stop = { run = "python tools/scripts/apxm_cli.py process stop", description = "Stop canonical APXM CLI job processes" }

[install]
wrap = { name = "apxm", target = "target/release/apxm" }

[[install.components]]
name = "compiler-runtime"
label = "Compiler + Runtime"
description = "APXM compiler and dataflow runtime"
run = "python tools/scripts/cargo.py build -p apxm-cli --features driver,metrics --release"
default = true
