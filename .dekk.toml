codegen = { run = "python tools/scripts/cargo.py run -p apxm-cli-dev --bin apxm-dev -- codegen op-spec && python tools/scripts/cargo.py run -p apxm-cli-dev --bin apxm-dev -- codegen frontend && python tools/scripts/cargo.py run -p apxm-cli-dev --bin apxm-dev -- codegen typescript && python tools/scripts/cargo.py run -p apxm-cli-dev --bin apxm-dev -- codegen typescript-frontend && python tools/scripts/cargo.py run -p apxm-cli-dev --bin apxm-dev -- codegen event-kinds && python tools/scripts/cargo.py run -p apxm-cli-dev --bin apxm-dev -- codegen capabilities && python tools/scripts/cargo.py run -p apxm-cli-dev --bin apxm-dev -- codegen permissions && python tools/scripts/cargo.py run -p apxm-cli-dev --bin apxm-dev -- codegen frontend-vocabulary && python tools/scripts/cargo.py run -p apxm-cli-dev --bin apxm-dev -- codegen frontend-records && python tools/scripts/cargo.py run -p apxm-cli-dev --bin apxm-dev -- codegen frontend-serializers && python tools/scripts/cargo.py run -p apxm-cli-dev --bin apxm-dev -- codegen diagnostics && python tools/scripts/cargo.py run -p apxm-cli-dev --bin apxm-dev -- codegen frontend-conformance && python tools/scripts/cargo.py run -p apxm-cli-dev --bin apxm-dev -- codegen docs", description = "Regenerate the operation catalog, frontend bindings, event kind metadata, capability catalogue, permission decisions, source graph vocabulary, FrontendGraph contract record types and serializers, authoring diagnostic codes, the shared frontend-conformance harness, and the documentation reference tables", skill = true, group = "Build & Test" }
