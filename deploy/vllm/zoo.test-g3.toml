# Two-replica deployment smoke.
#
# One model with replicas=2. The two replicas land on consecutive ports
# starting at port_base = 8965 and register as distinct backend names
# (-r0, -r1). Each backend name is an exact model reference the registry
# binds on its own; the registry never chooses among the replicas.

schema_version = 1

[defaults]
image = "apxm-vllm-runtime:a0e42ad3-e4e3a9af-post-rebase"
scheduling_policy = "priority"
enable_prefix_caching = true
max_num_seqs = 32

[[deployment]]
name = "g3-qwen3"
model = "Qwen/Qwen3-4B"
served_model_name = "Qwen3-4B"
backend_name = "vllm-fork-g3-qwen"
nodes = 1
tensor_parallel = 1
replicas = 2
port_base = 8965
gpus = "0"
weights_gb = 8
max_model_len = 8192
