# Two-service smoke manifest.
#
# Two small models on distinct ports, each TP=1, each consuming one node
# from the mi300x partition. Validates the zoo apply path end-to-end
# (manifest -> sbatch -> service-list -> probe -> /v1/models).
#
# Cache-warm both models before applying:
#   dekk apxm vllm zoo cache-warm deploy/vllm/zoo.test-g2.toml

schema_version = 1

[defaults]
image = "apxm-vllm-runtime:a0e42ad3-e4e3a9af-post-rebase"
scheduling_policy = "priority"
enable_prefix_caching = true
max_num_seqs = 32

[[deployment]]
name = "g2-qwen3-4b"
model = "Qwen/Qwen3-4B"
served_model_name = "Qwen3-4B"
backend_name = "vllm-fork-g2-qwen"
nodes = 1
tensor_parallel = 1
replicas = 1
port = 8961
gpus = "0"
weights_gb = 8
max_model_len = 8192

# meta-llama/Llama-3.2-1B is gated on HuggingFace and Meta has not granted
# this account access; cache-warm hits GatedRepoError. Swap to Qwen2.5-0.5B
# (ungated, ~1 GB, same role: tiny second-model in the two-service smoke).
[[deployment]]
name = "g2-qwen25-0p5b"
model = "Qwen/Qwen2.5-0.5B"
served_model_name = "Qwen2.5-0.5B"
backend_name = "vllm-fork-g2-qwen25"
nodes = 1
tensor_parallel = 1
replicas = 1
port = 8962
gpus = "0"
weights_gb = 2
max_model_len = 8192
