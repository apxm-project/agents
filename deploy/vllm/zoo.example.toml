# APXM-vLLM model-zoo manifest — EXAMPLE / TEMPLATE.
#
# This file is illustrative. Operators write their own zoo manifest at
# `deploy/vllm/zoo.toml` (gitignored) or any path passed to
# `dekk apxm vllm zoo-apply <path>`. The schema is the same.
#
# The operator flow covers manifest fields, cache warming, registration, and
# failure-mode handling as one deployment unit.
#
# The infrastructure is model-agnostic: vLLM runs in a container per
# service, and any model vLLM can load (any HF id, any local path) can
# be a deployment entry. The entries below exercise three deployment
# shapes — they are NOT a fixed production set.

schema_version = 1

# Cluster-wide defaults. Every [[deployment]] entry inherits these
# unless it overrides the key explicitly. Pin a known image so
# zoo-apply does not silently fall back to APXM_VLLM_IMAGE env.
[defaults]
image = "apxm-vllm-runtime:<APXM_SHA>-<VLLM_SHA>-post-rebase"
scheduling_policy = "priority"
enable_prefix_caching = true
max_num_seqs = 64
# Optional shared storage controls. APXM always mounts data.vllm.hf_cache
# at /models/hf. model_roots are mounted read-only under /models/roots/<n>
# and allow local-path refs such as /shared/models/snapshots/foo.
# model_roots = ["/shared/models"]

# --- Shape A: single-node single-instance ----------------------------
# One vLLM container on one node, all GPUs assigned to one TP group.
# Use when the model fits a single node and you want maximum
# per-request throughput (no replica fan-out).
[[deployment]]
name = "example-large-model"
model = "<HF_OR_LOCAL_REF>"               # e.g. openai/gpt-oss-120b, /shared/models/foo
served_model_name = "<BARE_SERVED_NAME>"  # e.g. gpt-oss-120b (NOT the HF org/repo)
backend_name = "vllm-fork"
tensor_parallel = 8
replicas = 1
port = 8916
gpus = "0,1,2,3,4,5,6,7"
weights_gb = 240
max_model_len = 32768
# Optional per-deployment HF cache override. Use only when this model lives in
# a distinct cache root; otherwise APXM searches data.vllm.hf_cache_roots.
# hf_home = "/shared/models/cache/huggingface/apxm-cache"
# Model-specific parser fields are OPTIONAL. Set ONLY when the model
# needs them; never default. A wrong reasoning_parser crashes vLLM
# startup with a vocab KeyError.
# reasoning_parser = "openai_gptoss"
# tool_call_parser = "openai"
# enable_auto_tool_choice = true

# --- Shape B: single-node multi-instance (gpu_groups) ----------------
# Several replicas of the same model on ONE node, each replica pinned
# to a disjoint GPU subset. Use when the model is small enough that
# you'd rather have N parallel servers than one large TP group.
[[deployment]]
name = "example-fast-model"
model = "<HF_OR_LOCAL_REF>"
served_model_name = "<BARE_SERVED_NAME>"
backend_name = "vllm-fork-fast"
tensor_parallel = 2
replicas = 4
port_base = 8920
gpu_groups = [[0, 1], [2, 3], [4, 5], [6, 7]]
weights_gb = 64
max_model_len = 32768

# --- Shape C: cross-node multi-instance (replicas) -------------------
# Same model, multiple Slurm allocations (one node per replica).
# Use when one replica saturates a node and you want horizontal
# capacity for the same served_model_name. The APXM registry will
# round-robin across the backends at request time.
[[deployment]]
name = "example-throughput-model"
model = "<HF_OR_LOCAL_REF>"
served_model_name = "<BARE_SERVED_NAME>"
backend_name = "vllm-fork-throughput"
tensor_parallel = 8
replicas = 2
port_base = 8930
gpus = "0,1,2,3,4,5,6,7"
weights_gb = 400
max_model_len = 32768
