name: task-intake-check

on:
  pull_request:

jobs:
  validate-task-intake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PR title is not placeholder
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          NORMALIZED="$(echo "${TITLE}" | tr '[:lower:]' '[:upper:]' | xargs)"
          if [[ "${NORMALIZED}" == "INVALID TASK" ]]; then
            echo "PR title must not be 'INVALID TASK'"
            exit 1
          fi

      - name: Validate repository task script
        run: |
          chmod +x scripts/validate-task.sh
          ./scripts/validate-task.sh "${{ github.event.pull_request.title }}"
