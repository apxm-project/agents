name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: cargo fmt --all --check
      - run: python tools/scripts/cargo.py check --workspace
      - run: python tools/scripts/cargo.py test --workspace --exclude apxm-compiler --exclude apxm-cli
