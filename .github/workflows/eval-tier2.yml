name: eval-tier2

# Tier-2 (compiler-pass effectiveness) gate. Runs on PRs that touch the
# pass implementations, the ablation harness, or the stress corpus —
# the only places where pass effectiveness can regress without showing
# up in tier-1 semantic-equivalence.
on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/compiler/apxm-compiler/src/passes/**'
      - 'crates/compiler/apxm-compiler/mlir/lib/Dialect/AIS/Transforms/**'
      - 'tools/ablation/**'
      - 'examples/python/_benchmarks/**'

jobs:
  tier2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: dekk apxm build
      # Tier-1 must still pass under every tier-2 change. Pass-effectiveness
      # tweaks must never silently break semantic equivalence.
      - name: Tier-1 must still pass under tier-2 changes
        run: dekk apxm test-all -- semantic_equivalence golden_artifact_roundtrip compile_is_deterministic
      - name: Ablation harness
        working-directory: tools
        run: python3 -m ablation
      - name: Pass-conflict matrix
        working-directory: tools
        run: python3 -m ablation.conflict_matrix
