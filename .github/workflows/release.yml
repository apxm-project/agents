name: release

# Tag-triggered publish pipeline for the TypeScript packages built out of
# this private repo. Both packages publish to npm as Apache-2.0-licensed,
# compiled-artifact-only packages (dist/ + typings + LICENSE) even though
# this repo itself stays MIT.
#
# Convention: push a tag matching one of
#   frontend-v<version>   -> build+typecheck+test+publish @apxm/frontend to npm
#   client-v<version>     -> build+typecheck+test+publish @apxm/client to npm
#
# Each package version bumps independently, so the tag prefix scopes the
# release to a single package's publish job. Both jobs run their own
# build+typecheck+test gate before any publish step executes.
on:
  push:
    tags:
      - "frontend-v*"
      - "client-v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Which package to publish (dry run only; use a tag push for a real publish)"
        required: true
        type: choice
        options:
          - frontend
          - client

jobs:
  frontend:
    if: >-
      startsWith(github.ref, 'refs/tags/frontend-v') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'frontend')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/compiler/frontend/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: install
        run: npm install
      - name: typecheck
        run: npm run typecheck
      - name: test
        run: npm run test
      - name: build
        run: npm run build
      - name: npm publish (dry run on manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: npm publish --dry-run --access public
      - name: npm publish
        if: startsWith(github.ref, 'refs/tags/frontend-v')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

  client:
    if: >-
      startsWith(github.ref, 'refs/tags/client-v') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'client')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/tools/client/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: install
        run: npm install
      - name: typecheck
        run: npm run typecheck
      - name: test
        run: npm run test
      - name: build
        run: npm run build
      - name: npm publish (dry run on manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: npm publish --dry-run --access public
      - name: npm publish
        if: startsWith(github.ref, 'refs/tags/client-v')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
