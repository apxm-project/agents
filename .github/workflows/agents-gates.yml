name: Agents product gates

on:
  pull_request:
  # `branches: [main]` meant a push to any feature branch triggered nothing, so
  # nineteen commits landed on `apxm/authorable-agents` unverified. The repo
  # already carries two feature namespaces (`apxm/**`, `feat/**`), so match every
  # branch rather than enumerating prefixes that go stale as new ones appear.
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

# Matching every branch means a branch with an open PR would otherwise run the
# whole job twice, once per event. `head_ref` (pull_request) and `ref_name`
# (push) are both the branch name, so both events share one group and the newer
# run supersedes the older. `main` never cancels: its runs are the merge record.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  deterministic:
    name: Portable product gates
    runs-on: ubuntu-24.04
    # A cold run links the MLIR/LLVM 22 dialect, builds the release CLI for
    # test-cli, and builds both frontends plus the npm example packages for
    # test-frontend-examples. The previous 20 minutes did not cover even the
    # cold cargo build; 90 left headroom for a cache miss. Raised to 120 for the
    # suites added below. The largest is `test-compiler`: cargo gives
    # `-p apxm-compiler` its own build-script output directory, so it configures
    # and links its own copy of the dialect rather than reusing the one `check`
    # built. That copy is cheaper than it sounds — the ninja graph is ~40
    # targets, about 50 CPU-seconds — so the whole addition is nearer 15 minutes
    # than an hour. A job that times out gates nothing.
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -el {0}
        working-directory: workspace/agents
    env:
      # cargo.py honours APXM_CARGO_TARGET_DIR and otherwise derives a target dir
      # from a hash of the project path under $TMPDIR, which is awkward to cache.
      # Pin it next to the workspace instead. Both cached directories live
      # OUTSIDE the checkout so `actions/checkout` cleaning cannot wipe them.
      APXM_CARGO_TARGET_DIR: ${{ github.workspace }}/.apxm-cargo-target
      CONDA_PKGS_DIRS: ${{ github.workspace }}/.conda-pkgs
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          path: workspace/agents
          persist-credentials: false
          # `commit-lint --range` walks every commit a PR adds, which the default
          # depth-1 checkout cannot reach. The whole history is 36 MB.
          fetch-depth: 0

      # `.dekk.toml` and rust-toolchain.toml require this exact toolchain. Keep
      # the compiler identity fixed so a target cache can never mix metadata
      # from different rustc versions; the target directory is intentionally
      # not cached below.
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install 1.91.1 --profile minimal --no-self-update
          rustup default 1.91.1
          cargo --version
          rustc --version

      # `.dekk.toml [env]` resolves RUSTUP_HOME and CARGO_HOME under the Dekk
      # user's home. Install shims with the same values so Dekk cannot select a
      # host rustup context different from the pinned project toolchain.
      - name: Shim the Rust toolchain for the dekk env contract
        run: |
          toolchain_bin="$(dirname "$(rustup which cargo)")"
          mkdir -p "$HOME/.local/bin"
          for tool in cargo rustc rustdoc; do
            [ -x "$toolchain_bin/$tool" ] || continue
            cat > "$HOME/.local/bin/$tool" <<SHIM
          #!/usr/bin/env bash
          set -euo pipefail
          export RUSTUP_HOME="$HOME/.rustup"
          export CARGO_HOME="$HOME/.cargo"
          exec "$toolchain_bin/$tool" "\$@"
          SHIM
            chmod +x "$HOME/.local/bin/$tool"
          done
          "$HOME/.local/bin/cargo" --version

      # A scratch env that only hosts the Dekk runner. It deliberately does NOT
      # point at {project}/.dekk/env: the conda provider short-circuits
      # (`if existing and not force: return`) when the prefix already exists, so
      # pre-creating .dekk/env with a bare python is what previously left the
      # declared mlir/clang/nodejs packages uninstalled.
      - name: Create the Dekk runner Conda env
        uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3.3.0
        with:
          activate-environment: dekk-runner
          channels: conda-forge
          conda-remove-defaults: "true"
          miniforge-version: "25.3.1-0"
          python-version: "3.11"

      # `.dekk/` is gitignored, so `.dekk/environment.yaml` is generated by
      # `dekk agents setup` from `[environment.packages]`. Key on `.dekk.toml`,
      # which is the actual source of the package set.
      - name: Cache Conda packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ github.workspace }}/.conda-pkgs
          key: conda-${{ runner.os }}-${{ hashFiles('workspace/agents/.dekk.toml') }}
          restore-keys: |
            conda-${{ runner.os }}-

      - name: Cache Cargo registry
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          # Do not cache the compiler target directory. It contains rustc
          # metadata whose producer version is part of the artifact identity;
          # a floating stable toolchain can otherwise restore .rmeta files
          # produced by a different rustc and fail with E0514 before gates run.
          # Version the key because older archives with the same Cargo.lock
          # still contain the target directory.
          key: cargo-registry-v2-rust-1.91.1-${{ runner.os }}-${{ hashFiles('workspace/agents/Cargo.lock') }}
          restore-keys: |
            cargo-registry-v2-rust-1.91.1-${{ runner.os }}-

      - name: Install the pinned public Dekk runner
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          --index-url https://pypi.org/simple "dekk==1.11.5"

      # Creates {project}/.dekk/env from [environment.packages]: mlir=22,
      # libclang13=22, clang=22, gxx_linux-64, cmake, ninja, uv, nodejs=22.
      # Every dekk project command below refuses to run without this prefix.
      - name: Provision the APXM toolchain environment
        run: dekk agents setup

      - name: Diagnose the toolchain
        run: dekk agents doctor

      # Cheap deterministic gates first so they fail fast before any Rust build.
      # The commit rules were otherwise enforced only by the developer-side
      # `commit` skill, so a contributor who never runs it lands unlinted
      # messages. A PR is the last point where a rewrite is still cheap, so this
      # is PR-only: on a push the branch history is already published and a red
      # gate could only be cleared by a force-push the repo boundaries forbid.
      # It costs about a second and needs nothing built, so it goes first.
      - name: Lint the commit messages this pull request adds
        if: github.event_name == 'pull_request'
        run: |
          dekk agents commit-lint --range \
            "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      # Formatting needs no build either: ungated `cargo fmt` had drifted across
      # crates no recent change touched, so every unrelated diff carried
      # incidental reflow.
      - name: Check Rust formatting
        run: dekk agents fmt-check

      - name: Check authoring surface alignment
        run: dekk agents check-frontend-surface

      - name: Check the de-versioning sweep is complete
        run: dekk agents check-deversion

      # The project discovery root is what `list_skills` / `read_skill` serve at
      # runtime, so a skill directory that fails this gate is one the runtime
      # index would refuse. Cheap and deterministic, so it runs before any build.
      - name: Validate the checked-in Agent Skills
        run: dekk agents check-agent-skills

      - name: Check generated metadata, parity, and compiler types
        run: dekk agents check

      # Keep the shipping build visible as its own gate. Several later suites
      # build release/debug binaries as prerequisites, but a direct build step
      # makes the product artifact requirement discoverable and fails before
      # the longer test battery when release linking is broken.
      - name: Build the release CLI
        run: dekk agents build

      # Clippy was never gated, so `-D warnings` violations accumulated
      # unnoticed across several crates until a sweep had to clear them in
      # bulk. It runs right after `check` to reuse that warm target dir, and
      # before the test steps so a lint failure is cheap to see.
      - name: Lint Rust sources
        run: dekk agents clippy

      - name: Run workspace and canonical authoring tests
        run: dekk agents test

      # `test` passes `--exclude apxm-compiler --exclude apxm-cli`, so until this
      # step the canonical AIR -> AIS lowering in crates/compiler/pipeline was
      # gated by nothing at all — `check` type-checks it and no step ran its
      # tests. The aggregate suite below is the authoritative all-workspace
      # Cargo gate; the focused compiler/CLI steps remain because they exercise
      # release features and installed-frontends that the aggregate command
      # does not cover.
      - name: Run the aggregate all-workspace test suite
        run: dekk agents test-all

      # Keep a focused compiler gate as well: it gives pipeline failures a
      # direct, readable check name instead of hiding them in the aggregate.
      - name: Run compiler AIR builder and pipeline tests
        run: dekk agents test-compiler

      - name: Run CLI tests
        run: dekk agents test-cli

      # The CLI's only coverage of compiling a package-level Python entry is
      # `#[ignore]`d, because it spawns a subprocess that imports the authoring
      # frontend. Nothing passed `--ignored`, so it never ran and its fixture
      # rotted against the current surface. This step installs the frontend and
      # runs it.
      - name: Run CLI tests that need the installed Python frontend
        run: dekk agents test-cli-installed-frontend

      # `test-cli` installs crates/tools/cli/agent-packaging's locked
      # dependencies with `npm ci` and then never runs its suite. This step is
      # only `npm test` in that directory, so it must stay directly after the
      # step that populates node_modules. It typechecks `index.d.ts` — the
      # package's whole public type surface, which had no gate at all — before
      # running the suite.
      - name: Run handler-packaging tests
        run: dekk agents test-handler-packaging

      # `test-cli`, `check`, and `test-frontend-examples` all passed once while
      # a checked-in example's integrity.toml was stale. This is the gate that
      # notices: every checked-in package is linted and held against its own
      # chain, so a package edit without `dekk agents build-agent-packages`
      # fails here.
      - name: Verify checked-in agent packages
        run: dekk agents check-agent-packages

      # The Python frontend's suite rides along inside `test`; the TypeScript
      # one ran nowhere, so CI built that frontend and never tested it — the
      # shared frontend-conformance corpus was gated on one of its two halves.
      # This also does the `npm ci` and the release native build that the two
      # steps after it reuse, so it comes first of the three.
      - name: Run TypeScript frontend tests
        run: dekk agents test-typescript-frontend

      # The only gate on compiling a package that depends on the published
      # frontend the way a consumer outside this repo would, rather than on the
      # in-tree sources. Reuses the frontend the previous step built.
      - name: Compile an external TypeScript package through the public frontend
        run: dekk agents test-external-source-package

      - name: Run repository example frontend tests
        run: dekk agents test-frontend-examples

      # Sibling of the gated `check-agent-packages`, and the same stale-artifact
      # class: it recompiles the checked-in example artifacts under
      # crates/machine/program/tests/fixtures/example-artifacts and diffs them.
      # It builds nothing itself, so it must follow `test-frontend-examples` —
      # that step installs the Python `_native.so` and the example's
      # node_modules/dist this check compiles through. Run before them it fails
      # against a stale bridge instead of reporting real drift.
      #
      # This step is also why `test-execution` is deliberately absent. Its
      # frontend-build prefix looks like it makes the apxm-execution tests see
      # installed natives, but those tests reach the frontends only through
      # `include_str!` of the same two example-artifact fixtures, compiled in
      # and never read at run time. Its cargo half is already covered by `test`,
      # and its frontend half is those fixtures' freshness — which this checks
      # directly and far more cheaply.
      - name: Drift-check the checked-in example artifacts
        run: dekk agents check-example-artifacts

      # A `Skill` declaration is only worth anything if the instructions it
      # names can be read at execution. This runs the Skilled example end to
      # end — compile, publish into a discovery root, execute — so the claim
      # that `Skill(...).load()` reaches `read_skill` is checked rather than
      # asserted.
      - name: Execute the Agent Skill example
        run: dekk agents test-skill-example

      # Nothing else dispatches a shipped handler: the packaging gate checks the
      # manifest and the package gate checks the chain. This runs one.
      - name: Execute the Capability handlers a package ships
        run: dekk agents test-package-handler-example

      # The same gate for the other frontend. A Python declaration that compiles
      # but cannot be dispatched is the defect the TypeScript step above catches,
      # and nothing else here would notice it: the packaging gate checks a
      # manifest and the package gate checks a chain. This runs one.
      - name: Execute the Python Capability handler a package ships
        run: dekk agents test-python-handler-example

      # The whole spine on the shipping path: authored source through the
      # compilation service to canonical AIR, then admitted and executed. The
      # suites above each cover one hop of it.
      - name: Compile the canonical example through the compilation service
        run: dekk agents compile-service-canonical

      - name: Execute the canonical example
        run: dekk agents execute-canonical

      - name: Run repository tooling tests
        run: python -m pytest tools/tests/

      # Validate owner qualification logic and fail-closed metadata behavior.
      # This intentionally does not manufacture a release artifact or claim
      # that current main is runtime-ready.
      - name: Test owner release qualification
        run: dekk agents test-release-qualification
