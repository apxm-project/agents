name: Agents product gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deterministic:
    name: Portable product gates
    runs-on: ubuntu-24.04
    # A cold run links the MLIR/LLVM 22 dialect, builds the release CLI for
    # test-cli, and builds both frontends plus the npm example packages for
    # test-frontend-examples. The previous 20 minutes did not cover even the
    # cold cargo build; 90 leaves headroom for a cache miss.
    timeout-minutes: 90
    defaults:
      run:
        shell: bash -el {0}
        working-directory: workspace/agents
    env:
      # cargo.py honours APXM_CARGO_TARGET_DIR and otherwise derives a target dir
      # from a hash of the project path under $TMPDIR, which is awkward to cache.
      # Pin it next to the workspace instead. Both cached directories live
      # OUTSIDE the checkout so `actions/checkout` cleaning cannot wipe them.
      APXM_CARGO_TARGET_DIR: ${{ github.workspace }}/.apxm-cargo-target
      CONDA_PKGS_DIRS: ${{ github.workspace }}/.conda-pkgs
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          path: workspace/agents
          persist-credentials: false

      # `.dekk.toml [tools]` requires cargo >= 1.70 on PATH. ubuntu-24.04 ships
      # rustup but no toolchain, so install one rather than depending on a
      # third-party action.
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          cargo --version
          rustc --version

      # `.dekk.toml [env]` pins RUSTUP_HOME and CARGO_HOME to this project's HPC
      # paths, and dekk OVERWRITES the ambient values when it runs a project
      # command. Neither path exists on a runner, so rustup's own shims in
      # ~/.cargo/bin cannot resolve a toolchain and cargo cannot create its
      # registry. Developer machines already solve this with a wrapper on
      # ~/.local/bin, which `.dekk.toml [paths] bin` ranks above ~/.cargo/bin;
      # CI installs the same shape so no shared env contract has to change.
      - name: Shim the Rust toolchain for the dekk env contract
        run: |
          toolchain_bin="$(dirname "$(rustup which cargo)")"
          mkdir -p "$HOME/.local/bin"
          for tool in cargo rustc rustdoc; do
            [ -x "$toolchain_bin/$tool" ] || continue
            cat > "$HOME/.local/bin/$tool" <<SHIM
          #!/usr/bin/env bash
          set -euo pipefail
          export RUSTUP_HOME="$HOME/.rustup"
          export CARGO_HOME="$HOME/.cargo"
          exec "$toolchain_bin/$tool" "\$@"
          SHIM
            chmod +x "$HOME/.local/bin/$tool"
          done
          "$HOME/.local/bin/cargo" --version

      # A scratch env that only hosts the Dekk runner. It deliberately does NOT
      # point at {project}/.dekk/env: the conda provider short-circuits
      # (`if existing and not force: return`) when the prefix already exists, so
      # pre-creating .dekk/env with a bare python is what previously left the
      # declared mlir/clang/nodejs packages uninstalled.
      - name: Create the Dekk runner Conda env
        uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3.3.0
        with:
          activate-environment: dekk-runner
          channels: conda-forge
          conda-remove-defaults: "true"
          miniforge-version: "25.3.1-0"
          python-version: "3.11"

      # `.dekk/` is gitignored, so `.dekk/environment.yaml` is generated by
      # `dekk agents setup` from `[environment.packages]`. Key on `.dekk.toml`,
      # which is the actual source of the package set.
      - name: Cache Conda packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ github.workspace }}/.conda-pkgs
          key: conda-${{ runner.os }}-${{ hashFiles('workspace/agents/.dekk.toml') }}
          restore-keys: |
            conda-${{ runner.os }}-

      - name: Cache Cargo registry and target dir
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ github.workspace }}/.apxm-cargo-target
          key: cargo-${{ runner.os }}-${{ hashFiles('workspace/agents/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install the pinned public Dekk runner
        run: python -m pip install --disable-pip-version-check "dekk==1.11.5"

      # Creates {project}/.dekk/env from [environment.packages]: mlir=22,
      # libclang13=22, clang=22, gxx_linux-64, cmake, ninja, uv, nodejs=22.
      # Every dekk project command below refuses to run without this prefix.
      - name: Provision the APXM toolchain environment
        run: dekk agents setup

      - name: Diagnose the toolchain
        run: dekk agents doctor

      # Cheap deterministic gates first so they fail fast before any Rust build.
      - name: Check authoring surface alignment
        run: dekk agents check-frontend-surface

      - name: Check the de-versioning sweep is complete
        run: dekk agents check-deversion

      - name: Check generated metadata, parity, and compiler types
        run: dekk agents check

      - name: Run workspace and canonical authoring tests
        run: dekk agents test

      - name: Run CLI tests
        run: dekk agents test-cli

      # `test-cli`, `check`, and `test-frontend-examples` all passed once while
      # a checked-in example's integrity.toml was stale. This is the gate that
      # notices: every checked-in package is linted and held against its own
      # chain, so a package edit without `dekk agents build-agent-packages`
      # fails here.
      - name: Verify checked-in agent packages
        run: dekk agents check-agent-packages

      - name: Run repository example frontend tests
        run: dekk agents test-frontend-examples

      - name: Run repository tooling tests
        run: python -m pytest tools/tests/
