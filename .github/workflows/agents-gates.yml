name: Agents product gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deterministic:
    name: Portable product gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash -el {0}
        working-directory: workspace/agents
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          path: workspace/agents
          persist-credentials: false

      - name: Create the portable-gate Conda prefix
        uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3.3.0
        with:
          activate-environment: ${{ github.workspace }}/workspace/agents/.dekk/env
          channels: conda-forge
          conda-remove-defaults: "true"
          miniforge-version: "25.3.1-0"
          python-version: "3.11"

      - name: Install the pinned public Dekk runner
        run: python -m pip install --disable-pip-version-check "dekk==1.11.5"

      - name: Check authoring surface alignment
        run: dekk agents check-frontend-surface

  source-compiler-acceptance:
    name: Source/compiler acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -el {0}
        working-directory: workspace/agents
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          path: workspace/agents
          persist-credentials: false

      - name: Provision the complete Dekk environment
        uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3.3.0
        with:
          activate-environment: base
          channels: conda-forge
          conda-remove-defaults: "true"
          miniforge-version: "25.3.1-0"
          python-version: "3.11"

      - name: Install the pinned public Dekk runner
        run: python -m pip install --disable-pip-version-check "dekk==1.11.5"

      - name: Clear any partial hosted-runner nightly toolchain
        run: rustup toolchain uninstall nightly || true

      - name: Provision the declared native toolchain
        run: dekk agents setup

      - name: Run the source/compiler acceptance bundle
        run: dekk agents test-source-compiler-acceptance

      - name: Upload the acceptance report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-compiler-acceptance-${{ github.sha }}
          path: workspace/agents/.apxm/compiler/source-compiler-acceptance
          if-no-files-found: warn
