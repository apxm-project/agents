[workspace]
members = [
	# ── Machine (AAM/AIS Contracts) ──────────────────────────────────────────
	"crates/machine/ais",
	"crates/machine/contracts",
	"crates/machine/program",
	# ── Compiler (Compilation) ────────────────────
	"crates/compiler/pipeline",
	"crates/compiler/frontend/native/python",
	"crates/compiler/frontend/native/typescript",
	# ── Runtime (Execution + Backend) ─────────────
	"crates/runtime/engine",
	"crates/runtime/capability-iface",
	"crates/runtime/capability",
	"crates/runtime/aam",
	"crates/runtime/memory",
	"crates/runtime/backends",
	"crates/runtime/backend-registry",
	"crates/runtime/rollout",
	"crates/runtime/inference",
	"crates/runtime/kernel",
	"crates/runtime/execution",
	"crates/runtime/composition",
	# ── Orchestration (ACP + Artifact) ───
	"crates/orchestration/acp",
	"crates/orchestration/artifact",
	# ── Tools (CLI + developer clients) ───────────
	"crates/tools/cli",
	# ── Observability (shared telemetry bootstrap, ) ─────────
	"crates/observability",
]

resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/apxm-project/agents"
homepage = "https://github.com/apxm-project/agents"
authors = ["The APXM authors"]
keywords = ["agents", "llm", "compiler", "runtime", "ai"]
categories = ["AI", "compilers", "science"]
readme = "README.md"

[workspace.dependencies]
# ── Internal crates ──────────────────────────────────────────
apxm-ais = { version = "0.1.0", path = "crates/machine/ais" }
apxm-core = { version = "0.1.0", path = "crates/machine/contracts" }
apxm-program = { version = "0.1.0", path = "crates/machine/program" }
apxm-compiler = { version = "0.1.0", path = "crates/compiler/pipeline" }
apxm-runtime = { version = "0.1.0", path = "crates/runtime/engine" }
apxm-capability-iface = { version = "0.1.0", path = "crates/runtime/capability-iface" }
apxm-capability = { version = "0.1.0", path = "crates/runtime/capability" }
apxm-aam = { version = "0.1.0", path = "crates/runtime/aam" }
apxm-memory = { version = "0.1.0", path = "crates/runtime/memory" }
apxm-backends = { version = "0.1.0", path = "crates/runtime/backends" }
apxm-backend-registry = { version = "0.1.0", path = "crates/runtime/backend-registry" }
apxm-rollout = { version = "0.1.0", path = "crates/runtime/rollout" }
apxm-inference = { version = "0.1.0", path = "crates/runtime/inference" }
apxm-kernel = { version = "0.1.0", path = "crates/runtime/kernel" }
apxm-execution = { version = "0.1.0", path = "crates/runtime/execution" }
apxm-composition = { version = "0.1.0", path = "crates/runtime/composition" }
apxm-acp = { version = "0.1.0", path = "crates/orchestration/acp" }
apxm-artifact = { version = "0.1.0", path = "crates/orchestration/artifact" }
apxm-observability = { version = "0.1.0", path = "crates/observability" }

# ── Serialization ────────────────────────────────────────────
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
bincode = "1.0"

# ── Error handling ───────────────────────────────────────────
anyhow = "1.0"
thiserror = "2.0"

# ── Async runtime ───────────────────────────────────────────
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
async-trait = "0.1"
async-stream = "0.3"
futures = "0.3"
tokio-stream = "0.1"

# ── HTTP ─────────────────────────────────────────────────────
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["fs", "cors", "limit"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
http = "1"

# ── Observability (OTLP) ─────────────────────────────────────
tracing-opentelemetry = "0.28"
opentelemetry = { version = "0.27", features = ["trace"] }
opentelemetry-otlp = { version = "0.27", features = ["http-proto", "reqwest-rustls"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }

# ── Concurrency ──────────────────────────────────────────────
dashmap = "6.0"
parking_lot = "0.12"
crossbeam-deque = "0.8"

# ── Observability ────────────────────────────────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# ── Utilities ────────────────────────────────────────────────
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v7", "v4", "serde"] }
dirs = "5.0"
once_cell = "1.0"
regex = "1.0"
tempfile = "3.0"
colored = "3.0"
blake3 = "1.5"
ed25519-dalek = { version = "2", features = ["pkcs8", "serde"] }
clap = { version = "4.0", features = ["derive"] }
bpe-openai = "0.3"
walkdir = "2.0"
rusqlite = { version = "0.32", features = ["bundled"] }
jsonschema = "0.18"
sha2 = "0.10"
utoipa = { version = "5.5", features = ["axum_extras"] }
serde_yaml = "0.9"
progenitor = "0.14"
progenitor-client = "0.14"
openapiv3 = "2.2"

# ── Dev ──────────────────────────────────────────────────────
insta = { version = "1.0", features = ["yaml"] }

# ── Workspace lints ──────────────────────────────────────────
[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Allow common patterns that are fine in this codebase
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
similar_names = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
wildcard_imports = "allow"
default_trait_access = "allow"
items_after_statements = "allow"
needless_pass_by_value = "allow"
return_self_not_must_use = "allow"
single_match_else = "allow"
enum_glob_use = "allow"
redundant_closure_for_method_calls = "allow"
manual_string_new = "allow"
uninlined_format_args = "allow"
trivially_copy_pass_by_ref = "allow"
implicit_hasher = "allow"
unnecessary_wraps = "allow"
unreadable_literal = "allow"
doc_markdown = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 0
debug = 2
