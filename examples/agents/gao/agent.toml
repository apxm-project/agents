    "workflow-reviewer",
]
capabilities = [
    "bash",
    "capability_discovery",
    "compose_workflow",
    "explain_permission",
    "http_get",
    "list_files",
    "list_local_skills",
    "plan_workflow",
    "prepare_validation",
    "read",
    "read_local_skill",
    "run_workflow",
    "search_skills",
    "write",
]
