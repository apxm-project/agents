capabilities = [
    "bash",
    "compose_workflow",
    "explain_permission",
    "list_files",
    "list_local_skills",
    "plan_workflow",
    "prepare_validation",
    "read_file",
    "read_local_skill",
    "run_workflow",
    "search_skills",
    "write_file",
]
description = "A looped APXM agent for designing, reviewing, and controlling APXM workflows."
display_name = "Gao"
domain = "apxm"
id = "gao"
kind = "agent"
license = "MIT"
skills = [
    "agent-builder",
    "workflow-designer",
    "workflow-reviewer",
]
version = "0.1.0"

[compile]
frontend = "typescript"

[[hooks]]
event = "pre_turn"
handler = "capabilities.handlers.hooks.injectContext"
mode = "observe"

[[hooks]]
event = "pre_ask"
handler = "capabilities.handlers.hooks.injectApxmContext"
mode = "observe"

[[hooks]]
event = "pre_cap"
handler = "capabilities.handlers.hooks.gateComposeWorkflow"
match = "compose_workflow"
mode = "gate"

[[hooks]]
event = "post_cap"
handler = "capabilities.handlers.hooks.redactToolResults"
match = "*"
mode = "observe"

[[hooks]]
event = "post_turn"
handler = "capabilities.handlers.hooks.compactConversation"
mode = "observe"

[prompts]
persona = "prompts/persona.md"
response_style = "prompts/response-style.md"
safety = "prompts/safety.md"
terminology = "prompts/apxm-terminology.md"
workflow_authoring = "prompts/workflow-authoring.md"

[runtime]
memory_space = "stm"
session_prefix = "gao"

[runtime.loop]
mode = "recv"
rearm = true
turn_param = "user_message"

[source]
type = "local"
