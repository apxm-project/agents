capabilities = [
    "edit",
    "read",
    "test",
]
description = "A read-only coding assistant that inspects source and prepares edit and test proposals."
display_name = "Coder"
domain = "software"
id = "coder"
kind = "agent"
license = "MIT"
schema_version = "apxm.agent.v1"
skills = []
version = "0.1.0"

[compile]
frontend = "typescript"

[prompts]
persona = "prompts/persona.md"
safety = "prompts/safety.md"

[runtime]
memory_space = "stm"
session_prefix = "coder"

[runtime.loop]
mode = "host"
rearm = true
turn_param = "user_message"

[source]
type = "local"
