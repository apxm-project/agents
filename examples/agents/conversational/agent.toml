capabilities = []
display_name = "Conversational"
domain = "general"
id = "conversational"
kind = "agent"
license = "MIT"
skills = []
version = "0.1.0"

[compile]
frontend = "typescript"

[[hooks]]
event = "pre_turn"
handler = "capabilities.handlers.hooks.inject_context"
mode = "observe"

[[hooks]]
event = "pre_ask"
handler = "capabilities.handlers.hooks.read_back_summary"
mode = "observe"

[[hooks]]
event = "post_cap"
handler = "capabilities.handlers.hooks.redact_tool_results"
match = "*"
mode = "observe"

[[hooks]]
event = "post_turn"
handler = "capabilities.handlers.hooks.compact_conversation"
mode = "observe"

[prompts]
context = "prompts/context.md"
persona = "prompts/persona.md"

[runtime]
memory_space = "stm"
session_prefix = "conversational"

[runtime.loop]
mode = "recv"
rearm = true
turn_param = "user_message"

[source]
type = "local"
