allowed_agent_skills = []
capabilities = [
    "read",
    "search_web",
    "write",
]
display_name = "Conversational"
domain = "general"
id = "conversational"
kind = "agent"
license = "MIT"
schema_version = "apxm.agent.v1"
version = "0.1.0"

[compile]
entry = "python/agent.py"
frontend = "python"

[[hooks]]
event = "post_cap"
handler = "capabilities.handlers.hooks.redact_tool_results"
match = "*"
mode = "observe"

[prompts]
context = "prompts/context.md"
persona = "prompts/persona.md"

[runtime]
memory_space = "stm"
session_prefix = "conversational"

[source]
type = "local"
