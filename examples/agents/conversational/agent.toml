id = "conversational"
version = "0.1.0"
schema_version = "apxm.agent"
display_name = "Conversational"
domain = "general"
kind = "agent"
license = "MIT"

[compile]
entry = "python/agent.py"
frontend = "python"

[source]
type = "local"

[hierarchy]
permitted_children = []

# The deployment layer, on top of what the source asked for. The program
# requests `allow` for count_tokens; this narrows it to `ask`. It may only
# tighten a request, never widen one.
[permissions]
count_tokens = { decision = "ask", reason = "This deployment gates every measurement of user text." }
