capabilities = [
    "read",
    "search_web",
    "write",
]
display_name = "Conversational"
domain = "general"
id = "conversational"
kind = "agent"
license = "MIT"
schema_version = "apxm.agent.v1"
skills = []
version = "0.1.0"

[compile]
entry = "python/agent.py"
frontend = "python"

[[hooks]]
event = "pre_turn"
handler = "capabilities.handlers.hooks.inject_context"
mode = "observe"

[[hooks]]
event = "pre_ask"
handler = "capabilities.handlers.hooks.read_back_summary"
mode = "observe"

[[hooks]]
event = "post_cap"
handler = "capabilities.handlers.hooks.redact_tool_results"
match = "*"
mode = "observe"

[prompts]
context = "prompts/context.md"
persona = "prompts/persona.md"

[runtime]
compaction_policy = '{"keep_recent":2,"compact_at_tokens":300,"strategy":"summarize","summary_key":"conversation.summary"}'
memory_space = "stm"
session_prefix = "conversational"

[runtime.loop]
mode = "host"
rearm = true
turn_param = "user_message"

[source]
type = "local"
