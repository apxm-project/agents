# Model Profiles Configuration
#
# This file defines model profiles for use with APXM's ModelProfile system.
# Each profile provides a semantic abstraction (e.g., "reasoning-tier") with
# prioritized candidate models selected at runtime based on circuit-breaker health.
#
# Location: ~/.apxm/model_profiles.toml
#
# See docs/model-profiles-design.md for full design documentation.
#
# TOML format: use inline arrays for candidates within each [[profile]] block.

[[profile]]
name = "reasoning-tier"
description = "High-capability reasoning models for complex analysis and research tasks"
tags = ["reasoning", "analysis", "research"]
min_context_window = 128000
candidate = [
  { model = "claude-opus-4-6", priority = 1 },
  { model = "gpt-4o",          priority = 2 },
  { model = "claude-opus-4-5@20251101", priority = 3 },
]

[[profile]]
name = "balanced"
description = "General-purpose balanced models"
tags = ["balanced", "general"]
candidate = [
  { model = "claude-sonnet-4-5@20250929", priority = 1 },
  { model = "claude-sonnet-4@20250514",   priority = 2 },
  { model = "claude-haiku-4-5@20251001",  priority = 3 },
]

[[profile]]
name = "fast"
description = "Fast, low-latency models for high-throughput tasks"
tags = ["fast", "cheap"]
max_cost_per_1k_input = 0.001
candidate = [
  { model = "claude-haiku-4-5@20251001", priority = 1 },
  { model = "dvue-aoai-001-gpt-4.1-nano", priority = 2 },
]

[[profile]]
name = "openai-reasoning"
description = "OpenAI reasoning models for structured problem-solving"
tags = ["reasoning", "openai"]
candidate = [
  { model = "dvue-aoai-001-o4-mini", priority = 1 },
  { model = "dvue-aoai-001-o3",      priority = 2 },
  { model = "dvue-aoai-001-o1",      priority = 3 },
]

[[profile]]
name = "gemini-multimodal"
description = "Gemini models for vision and multimodal tasks"
tags = ["multimodal", "vision", "gemini"]
candidate = [
  { model = "gemini-2.5-pro",        priority = 1 },
  { model = "gemini-2.5-flash",      priority = 2 },
  { model = "gemini-2.5-flash-lite", priority = 3 },
]

[[profile]]
name = "onprem-code"
description = "On-premises coding models for sensitive environments"
tags = ["coding", "onprem"]
candidate = [
  { model = "deepseek-ai/DeepSeek-R1",                             priority = 1 },
  { model = "griffin-deepseek-coder-6.7b-instruct-enterprise-preview-9600", priority = 2 },
  { model = "meta-llama/Llama-4-Maverick-17B-128E-Instruct-FP8",  priority = 3 },
]
